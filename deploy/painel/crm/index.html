<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>Code Solution · CRM Comercial</title>
<style>
:root{--bg:#0a0810;--card:#12101a;--line:rgba(255,255,255,.09);--text:#ece9f2;--muted:#a7a4b6;--purple:#7B3FE4;--green:#5ce49a;--red:#ff7285;--amber:#ffce66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:rgba(10,8,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;font-size:18px;margin-right:auto}.brand b{color:#9b5cff}.btn{border:1px solid var(--line);background:#171321;color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.primary{background:var(--purple);border-color:transparent}.btn.whatsapp{background:#133b2a;border-color:#245f45}.field{background:#100d17;border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:10px;min-width:180px}.stats{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;padding:16px 20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:4px}.stat.alert strong{color:var(--red)}.board-wrap{overflow:auto;padding:0 20px 24px}.board{display:grid;grid-auto-flow:column;grid-auto-columns:290px;gap:12px;align-items:start;min-height:60vh}.col{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:14px;min-height:220px}.col-head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:73px;background:#0f0c16;border-radius:14px 14px 0 0;z-index:2}.cards{padding:10px;min-height:170px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer}.card:hover{border-color:rgba(155,92,255,.55)}.card.overdue{border-color:rgba(255,114,133,.55);box-shadow:inset 3px 0 0 var(--red)}.card h3{margin:0 0 4px;font-size:14px}.meta{color:var(--muted);font-size:12px}.score{display:inline-flex;align-items:center;justify-content:center;width:38px;height:24px;border-radius:999px;font-size:12px;font-weight:800;background:#21182f}.score.hot{color:var(--green)}.score.warm{color:var(--amber)}.score.cold{color:#9fa3b7}.next{margin-top:9px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}.due{display:block;margin-top:4px;color:var(--muted)}.due.overdue{color:var(--red);font-weight:700}.empty{color:var(--muted);padding:15px;text-align:center}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-start;justify-content:flex-end;z-index:30}.overlay.open{display:flex}.drawer{width:min(580px,100%);height:100%;overflow:auto;background:#0e0b15;border-left:1px solid var(--line);padding:20px}.drawer h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.timeline{border-left:2px solid #30243f;margin-left:7px;padding-left:16px}.event{margin:0 0 14px}.event time{display:block;color:var(--muted);font-size:11px}.notice{margin:20px;padding:14px;border:1px solid rgba(255,206,102,.3);background:rgba(255,206,102,.06);border-radius:12px;color:#ffe3a3}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.top{padding:12px}.board-wrap,.stats{padding-left:12px;padding-right:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="row"><div class="brand">CODE <b>SOLUTION</b> · CRM</div><input id="search" class="field" placeholder="Buscar lead, empresa, segmento"/><select id="temp" class="field"><option value="">Todas temperaturas</option><option value="quente">Quente</option><option value="morno">Morno</option><option value="frio">Frio</option></select><button id="refresh" class="btn">Atualizar</button><button id="settings" class="btn primary">Conectar CRM</button></div></header>
<div id="notice" class="notice hidden"></div>
<section class="stats"><div class="stat"><small>Leads</small><strong id="sTotal">0</strong></div><div class="stat"><small>Quentes</small><strong id="sHot">0</strong></div><div class="stat"><small>Em proposta</small><strong id="sProposal">0</strong></div><div class="stat"><small>Ganhos</small><strong id="sWon">0</strong></div><div class="stat alert"><small>Follow-ups atrasados</small><strong id="sOverdue">0</strong></div></section>
<div class="board-wrap"><main id="board" class="board"></main></div>
<div id="overlay" class="overlay"><aside class="drawer"><div class="row"><h2 id="dTitle" style="margin-right:auto">Lead</h2><button id="close" class="btn">Fechar</button></div><div id="quickActions" class="actions"></div><div class="grid"><label><span class="label">Status</span><select id="dStatus" class="field" style="width:100%"></select></label><label><span class="label">Responsável</span><input id="dOwner" class="field" style="width:100%"/></label><label class="full"><span class="label">Próxima ação</span><input id="dNext" class="field" style="width:100%"/></label><label><span class="label">Data da próxima ação</span><input id="dNextDue" type="date" class="field" style="width:100%"/></label><label><span class="label">Valor estimado</span><input id="dValue" class="field" style="width:100%" placeholder="Ex.: 15000"/></label><label><span class="label">Fechamento previsto</span><input id="dDate" type="date" class="field" style="width:100%"/></label><label class="full"><span class="label">Motivo de perda</span><input id="dLoss" class="field" style="width:100%"/></label><label class="full"><span class="label">Nota da atualização</span><textarea id="dNote" class="field" style="width:100%;min-height:90px"></textarea></label><div class="full"><button id="save" class="btn primary">Salvar atualização</button></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div id="details"></div><h3>Linha do tempo</h3><div id="timeline" class="timeline"></div></aside></div>
<script>
const API='https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev';
const STAGES=[['novo','Novo'],['qualificacao','Qualificação'],['contato_realizado','Contato realizado'],['discovery','Discovery'],['avaliacao_tecnica','Avaliação técnica'],['proposta','Proposta'],['negociacao','Negociação'],['follow_up','Follow-up'],['ganho','Ganho'],['perdido','Perdido'],['nutricao','Nutrição'],['arquivado','Arquivado']];
const CLOSED=new Set(['ganho','perdido','arquivado']);
let leads=[],summary=null,active=null,key=sessionStorage.getItem('cs_crm_key')||'';
const $=(id)=>document.getElementById(id); const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function headers(){return {'x-crm-key':key,'content-type':'application/json'}}
function setNotice(text){$('notice').textContent=text;$('notice').classList.toggle('hidden',!text)}
function overdue(l){if(CLOSED.has(l.status)||!l.nextActionDue)return false;const d=new Date(String(l.nextActionDue).length<=10?l.nextActionDue+'T23:59:59-03:00':l.nextActionDue);return !Number.isNaN(d.getTime())&&d<new Date()}
async function load(){if(!key){setNotice('Conecte o CRM informando a chave administrativa do Worker. A chave fica apenas nesta aba do navegador.');render([]);renderStats([]);return}setNotice('');try{const [lr,sr]=await Promise.all([fetch(API+'/crm/leads?limit=250',{headers:headers()}),fetch(API+'/crm/summary',{headers:headers()})]);const ld=await lr.json(),sd=await sr.json();if(!lr.ok)throw new Error(ld.error||'Falha ao carregar leads');leads=ld.leads||[];summary=sr.ok?sd:null;renderFiltered()}catch(e){setNotice('Não foi possível carregar o CRM: '+e.message);render([]);renderStats([])}}
function renderFiltered(){const q=$('search').value.toLowerCase().trim(),t=$('temp').value;const list=leads.filter(l=>(!t||l.temperature===t)&&(!q||[l.name,l.company,l.segment,l.need,l.whatsapp].some(v=>String(v||'').toLowerCase().includes(q))));render(list);renderStats(list)}
function renderStats(list){$('sTotal').textContent=list.length;$('sHot').textContent=list.filter(l=>l.temperature==='quente').length;$('sProposal').textContent=list.filter(l=>l.status==='proposta').length;$('sWon').textContent=list.filter(l=>l.status==='ganho').length;$('sOverdue').textContent=summary?.overdueFollowUps??list.filter(overdue).length}
function render(list){const by=Object.fromEntries(STAGES.map(([k])=>[k,[]]));for(const l of list)(by[l.status]||by.novo).push(l);$('board').innerHTML=STAGES.map(([stage,label])=>`<section class="col"><div class="col-head"><b>${label}</b><span>${by[stage].length}</span></div><div class="cards">${by[stage].length?by[stage].map(card).join(''):'<div class="empty">Sem leads</div>'}</div></section>`).join('');document.querySelectorAll('[data-lead]').forEach(el=>el.onclick=()=>openLead(el.dataset.lead))}
function card(l){const cls=l.score>=75?'hot':l.score>=45?'warm':'cold',isOver=overdue(l);const due=l.nextActionDue?new Date(String(l.nextActionDue).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'';return `<article class="card ${isOver?'overdue':''}" data-lead="${esc(l.id)}"><div class="row"><h3 style="margin-right:auto">${esc(l.name||'Sem nome')}</h3><span class="score ${cls}">${esc(l.score||0)}</span></div><div class="meta">${esc(l.company||l.segment||'Sem empresa informada')} · ${esc(l.whatsapp||'')}</div><div style="margin-top:7px">${esc((l.need||'').slice(0,130))}</div><div class="next"><b>Próxima:</b> ${esc(l.nextAction||'Definir ação')}${due?`<span class="due ${isOver?'overdue':''}">${isOver?'Atrasado · ':''}${esc(due)}</span>`:''}</div></article>`}
function openLead(id){active=leads.find(l=>l.id===id);if(!active)return;$('dTitle').textContent=active.name||'Lead';$('dStatus').innerHTML=STAGES.map(([v,l])=>`<option value="${v}" ${active.status===v?'selected':''}>${l}</option>`).join('');$('dOwner').value=active.owner||'';$('dNext').value=active.nextAction||'';$('dNextDue').value=String(active.nextActionDue||'').slice(0,10);$('dValue').value=active.estimatedValue||'';$('dDate').value=String(active.expectedCloseDate||'').slice(0,10);$('dLoss').value=active.lossReason||'';$('dNote').value='';const phone=String(active.whatsapp||'').replace(/\D/g,'');$('quickActions').innerHTML=phone?`<a class="btn whatsapp" target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(phone)}">Abrir WhatsApp</a>`:'';$('details').innerHTML=`<p><b>WhatsApp:</b> ${esc(active.whatsapp||'—')}<br><b>E-mail:</b> ${esc(active.email||'—')}<br><b>Empresa:</b> ${esc(active.company||'—')}<br><b>Segmento:</b> ${esc(active.segment||'—')}<br><b>Origem:</b> ${esc(active.source||'—')}<br><b>Score:</b> ${esc(active.score||0)}/100 · ${esc(active.temperature||'—')}</p><p><b>Necessidade</b><br>${esc(active.need||'—')}</p>`;$('timeline').innerHTML=(active.timeline||[]).slice().reverse().map(e=>`<div class="event"><time>${esc(new Date(e.at).toLocaleString('pt-BR'))}</time>${esc(e.text||e.type)}</div>`).join('')||'<div class="meta">Sem eventos.</div>';$('overlay').classList.add('open')}
async function save(){if(!active)return;const patch={status:$('dStatus').value,owner:$('dOwner').value,nextAction:$('dNext').value,nextActionDue:$('dNextDue').value||null,estimatedValue:$('dValue').value,expectedCloseDate:$('dDate').value||null,lossReason:$('dLoss').value,timelineText:$('dNote').value||undefined};const r=await fetch(API+'/crm/lead/'+encodeURIComponent(active.id),{method:'PATCH',headers:headers(),body:JSON.stringify(patch)});const d=await r.json();if(!r.ok){alert(d.error==='loss_reason_required'?'Informe o motivo de perda.':(d.error||'Erro ao salvar'));return}leads=leads.map(l=>l.id===active.id?d.lead:l);active=d.lead;await refreshSummary();renderFiltered();openLead(active.id)}
async function refreshSummary(){try{const r=await fetch(API+'/crm/summary',{headers:headers()});if(r.ok)summary=await r.json()}catch{}}
$('settings').onclick=()=>{const v=prompt('Chave administrativa do CRM:',key);if(v!==null){key=v.trim();sessionStorage.setItem('cs_crm_key',key);load()}};$('refresh').onclick=load;$('search').oninput=renderFiltered;$('temp').onchange=renderFiltered;$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=(e)=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('save').onclick=save;load();
</script>
</body>
</html>
