name: Actions canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-canary.yml'
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  canary:
    if: "${{ github.event_name == 'push' || github.event.issue.title == 'OPS actions canary' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record canary
        run: |
          mkdir -p docs
          printf '{"checkedAt":"%s","event":"%s","sha":"%s","ok":true}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_EVENT_NAME" "$GITHUB_SHA" > docs/actions-canary.json
          git config user.name "Code Solution Actions Canary"
          git config user.email "actions@users.noreply.github.com"
          git add docs/actions-canary.json
          git commit -m "chore: record Actions canary"
          git push origin HEAD:main
