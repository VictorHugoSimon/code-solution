name: CRM access recovery deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-canary.yml'

permissions:
  contents: write

concurrency:
  group: crm-access-recovery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          npm run check:bundled-surfaces
          node --check deploy/_worker.js
          grep -q "LOGIN_USERNAME = 'admin'" deploy/_worker.js
          grep -q "LOGIN_PASSWORD_SHA256" deploy/_worker.js

      - name: Sync CRM secret to Pages
        id: secret
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "cad25fe6c91871bbafb58236cf9b9b81"
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name=codesolution-site

      - name: Deploy Pages production
        id: pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy --project-name=codesolution-site --commit-hash="$GITHUB_SHA" --commit-message="CRM access recovery $GITHUB_SHA"

      - name: Validate live login
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 12
          login_http=$(curl -sS --retry 5 --retry-delay 3 -o /tmp/login.html -w '%{http_code}' https://codesolution-site.pages.dev/painel/login/)
          test "$login_http" = 200
          grep -q 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html
          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null https://codesolution-site.pages.dev/painel/crm/
          crm_http=$(head -n1 "$headers" | awk '{print $2}')
          location=$(grep -i '^location:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$crm_http" = 302
          echo "$location" | grep -q '/painel/login/'
          public_http=$(curl -sS --retry 5 --retry-delay 3 -o /tmp/public-login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$public_http" = 200
          grep -q 'Acesso ao CRM' /tmp/public-login.html
          grep -q 'name="username"' /tmp/public-login.html

      - name: Record recovery result
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/crm-access-release.json',JSON.stringify({
            checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,
            build:e.BUILD||'failure',crmSecretSync:e.SECRET||'failure',pagesDeploy:e.PAGES||'failure',liveLoginSmoke:e.SMOKE||'failure',
            loginUrl:'https://www.codesolution.com.br/painel/login/',username:'admin'
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution CRM Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add docs/crm-access-release.json
          git commit -m "chore: record CRM access release" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce recovery release
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          test "$BUILD" = success
          test "$SECRET" = success
          test "$PAGES" = success
          test "$SMOKE" = success
