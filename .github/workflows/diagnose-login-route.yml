name: Diagnose CRM login route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-login-route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Test public login route without valid credentials
        id: test
        run: |
          set -euo pipefail
          SITE=https://www.codesolution.com.br
          ATTENDANT=https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev

          login_http=$(curl -sS --retry 4 --retry-delay 2 -o /tmp/login.html -w '%{http_code}' "$SITE/painel/login/")
          test "$login_http" = 200
          grep -qi 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html

          attendant_http=$(curl -sS -o /tmp/attendant-login.json -w '%{http_code}' "$ATTENDANT/auth/login" -X POST -H 'content-type: application/json' --data '{"username":"__invalid__","password":"__invalid__"}')
          test "$attendant_http" = 401

          site_http=$(curl -sS -o /tmp/site-login.json -w '%{http_code}' "$SITE/auth/login" -X POST -H 'content-type: application/json' --data '{"username":"__invalid__","password":"__invalid__"}')
          test "$site_http" = 401

          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['/tmp/attendant-login.json','/tmp/site-login.json']){
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            if(x.ok!==false || x.error!=='invalid_credentials') throw new Error(`unexpected login rejection contract: ${p}`);
          }
          NODE

          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null "$SITE/painel/crm/"
          panel_http=$(head -n1 "$headers" | awk '{print $2}')
          panel_location=$(grep -i '^location:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$panel_http" = 302
          echo "$panel_location" | grep -q '/painel/login/'

          mkdir -p docs
          LOGIN_HTTP="$login_http" ATTENDANT_HTTP="$attendant_http" SITE_HTTP="$site_http" PANEL_HTTP="$panel_http" PANEL_LOCATION="$panel_location" node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/login-route-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),
            loginPageHttp:Number(e.LOGIN_HTTP),
            loginFormPresent:true,
            attendantInvalidLoginHttp:Number(e.ATTENDANT_HTTP),
            attendantInvalidLoginContract:true,
            sameOriginInvalidLoginHttp:Number(e.SITE_HTTP),
            sameOriginInvalidLoginContract:true,
            unauthenticatedCrmHttp:Number(e.PANEL_HTTP),
            unauthenticatedCrmRedirect:e.PANEL_LOCATION||'',
            routeHealthy:true,
            validCredentialNotLogged:true
          },null,2)+'\n');
          NODE

      - name: Persist route diagnostic
        run: |
          git config user.name 'Code Solution Login Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/login-route-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record CRM login route status'
          git pull --rebase origin main
          git push origin HEAD:main
