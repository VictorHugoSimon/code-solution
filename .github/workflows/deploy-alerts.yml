name: Code Solution deploy alerts

on:
  workflow_run:
    workflows:
      - "Deploy Cloudflare Pages"
      - "Deploy Cloudflare Workers"
    types: [completed]

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: 'ALERTA DEPLOY: Code Solution produção'

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Open update or close deploy incident
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title --jq ".[] | select(.title==\"$ISSUE_TITLE\") | .number" | head -n1)
          now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          if [ "$CONCLUSION" = success ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Deploy recuperado: **${WORKFLOW}** concluiu com sucesso em ${now}. Commit: \`${HEAD_SHA}\`. Run: ${RUN_URL}"
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi

          body="Falha/cancelamento detectado no deploy de Produção.\n\n- Workflow: **${WORKFLOW}**\n- Resultado: **${CONCLUSION}**\n- Commit: \`${HEAD_SHA}\`\n- Detectado: ${now}\n- Run: ${RUN_URL}\n\nSiga \`docs/RUNBOOK-PRODUCAO.md\` e não contorne os smokes obrigatórios."
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      - name: Publish summary
        run: |
          echo '## Code Solution · Deploy alert' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Workflow: `${{ github.event.workflow_run.name }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Conclusion: `${{ github.event.workflow_run.conclusion }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Commit: `${{ github.event.workflow_run.head_sha }}`' >> "$GITHUB_STEP_SUMMARY"
