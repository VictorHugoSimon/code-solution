name: Rearm Code Solution admin bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rearm-admin-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-solution-admin-bootstrap-recovery
  cancel-in-progress: false

jobs:
  rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'

      - name: Rearm one-time admin bootstrap credential
        id: rearm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="DELETE FROM panel_audit_log WHERE action='bootstrap_known_password_consumed';" --json > /tmp/delete.json
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT COUNT(*) AS remaining FROM panel_audit_log WHERE action='bootstrap_known_password_consumed';" --json > /tmp/check.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/check.json','utf8'));
          const rows=Array.isArray(x)?x:(x.result||[]);
          const row=(rows[0]?.results||rows[0]?.result||rows[0]||{});
          const remaining=Number(row.remaining ?? row?.results?.[0]?.remaining ?? 0);
          if (remaining !== 0) throw new Error(`bootstrap marker still present: ${remaining}`);
          NODE

      - name: Record recovery readiness
        if: always()
        env:
          REARM_OUTCOME: ${{ steps.rearm.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/admin-bootstrap-recovery-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),
            sourceCommit:e.SOURCE_SHA,
            rearm:e.REARM_OUTCOME||'failure',
            username:'admin',
            credentialState:e.REARM_OUTCOME==='success'?'bootstrap-ready':'not-ready',
            note:'No human password was written to repository, issue, log, or status file.'
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/admin-bootstrap-recovery-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record admin bootstrap recovery status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce recovery
        if: always()
        env:
          REARM_OUTCOME: ${{ steps.rearm.outcome }}
        run: test "$REARM_OUTCOME" = success
