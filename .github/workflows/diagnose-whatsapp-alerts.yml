name: Diagnose WhatsApp alerts

# Recheck runtime after WhatsApp template configuration changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-whatsapp-alerts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check WhatsApp alert runtime
        id: check
        env:
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CRM_ADMIN_KEY"
          ATTENDANT='https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev'
          http=$(curl -sS --max-time 30 -o /tmp/wa-health.json -w '%{http_code}' \
            "$ATTENDANT/crm/notifications/whatsapp/health" \
            -H "x-crm-key: $CRM_ADMIN_KEY")
          echo "http=$http" >> "$GITHUB_OUTPUT"
          test "$http" = 200
          node - <<'NODE'
          const x=require('/tmp/wa-health.json');
          if(x.ok!==true) throw new Error('WhatsApp health contract invalid');
          NODE

      - name: Persist WhatsApp alert status
        if: always()
        env:
          HTTP: ${{ steps.check.outputs.http }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          let health={};
          try{health=JSON.parse(fs.readFileSync('/tmp/wa-health.json','utf8'))}catch{}
          const out={
            checkedAt:new Date().toISOString(),
            sourceCommit:e.SOURCE_SHA,
            http:Number(e.HTTP||0),
            runtimeReachable:Number(e.HTTP||0)===200,
            configured:health.configured===true,
            tokenConfigured:health.tokenConfigured===true,
            phoneIdConfigured:health.phoneIdConfigured===true,
            recipientConfigured:health.recipientConfigured===true,
            templateConfigured:health.templateConfigured===true,
            mode:health.mode||'',
            note:health.note||''
          };
          fs.writeFileSync('docs/whatsapp-alerts-status.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name "Code Solution WhatsApp Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/whatsapp-alerts-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record WhatsApp alert status"
          git pull --rebase origin main
          git push origin HEAD:main
