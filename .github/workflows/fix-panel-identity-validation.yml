name: Align panel identity validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panel-identity-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align production identity smoke with Cloudflare WebCrypto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/validate-panel-identity.yml')
          text = p.read_text()
          old1 = "if(!t.includes('180000')) throw new Error('admin password hardening not found');"
          new1 = "if(!t.includes('100000')) throw new Error('Cloudflare-compatible admin password hardening not found');"
          old2 = "const user=process.env.USERNAME,id=process.env.USER_ID,pass=process.env.PASSWORD,salt=randomBytes(24),iterations=180000;"
          new2 = "const user=process.env.USERNAME,id=process.env.USER_ID,pass=process.env.PASSWORD,salt=randomBytes(24),iterations=100000;"
          for old,new in [(old1,new1),(old2,new2)]:
              if old not in text:
                  raise SystemExit(f'missing expected marker: {old}')
              text = text.replace(old,new)
          p.write_text(text)
          PY
          grep -q "includes('100000')" .github/workflows/validate-panel-identity.yml
          grep -q 'iterations=100000' .github/workflows/validate-panel-identity.yml
          if grep -q 'iterations=180000' .github/workflows/validate-panel-identity.yml; then exit 1; fi
      - name: Commit corrected identity validation
        run: |
          git config user.name "Code Solution Identity Test Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/validate-panel-identity.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: use Cloudflare-compatible PBKDF2 in identity smoke"
          git pull --rebase origin main
          git push origin HEAD:main
