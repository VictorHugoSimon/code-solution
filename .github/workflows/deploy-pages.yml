name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - 'content/blog/**'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate production bundle
        id: build
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          npm run check:panel-nav
          npm run check:bundled-surfaces
          node --check deploy/_worker.js
          for file in \
            deploy/index.html deploy/servicos/index.html deploy/setores/index.html deploy/calculadora/index.html \
            deploy/diagnostico/index.html deploy/assistente/index.html deploy/privacidade/index.html \
            deploy/cases/index.html deploy/cases/sos-truck/index.html deploy/cases/tonini/index.html deploy/cases/code-solution/index.html \
            deploy/painel/index.html deploy/painel/crm/index.html deploy/painel/atendimento/index.html deploy/painel/agenda/index.html \
            deploy/painel/prospeccao/index.html deploy/painel/marketing/index.html deploy/painel/inteligencia/index.html \
            deploy/painel/growth/index.html deploy/painel/relatorios/index.html deploy/painel/usuarios/index.html; do
            test -f "$file"
          done
          grep -q '/auth/login' deploy/_worker.js
          grep -q '/auth/session' deploy/_worker.js
          grep -q 'panelAllowed' deploy/_worker.js
          grep -q '/painel/usuarios/' deploy/painel/usuarios/index.html
          grep -q 'Minha segurança' deploy/painel/usuarios/index.html
          grep -q 'Trocar minha senha' deploy/painel/usuarios/index.html
          grep -q 'case-tracking.js' deploy/cases/sos-truck/index.html
          grep -q '<loc>https://www.codesolution.com.br/cases/</loc>' deploy/sitemap.xml
          grep -qi 'Code Solution' deploy/assistente/index.html
          if grep -qi '\bCodi\b' deploy/assistente/index.html; then echo '::error::Legacy Codi branding found'; exit 1; fi

      - name: Require personal Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'

      - name: Sync technical CRM key to Pages
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name=codesolution-site

      - name: Deploy production
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy --project-name=codesolution-site --commit-hash="$GITHUB_SHA" --commit-message="Code Solution production $GITHUB_SHA"

      - name: Validate public production
        id: smoke
        run: |
          set -euo pipefail
          sleep 15
          for path in / /servicos/ /setores/ /calculadora/ /diagnostico/ /assistente/ /privacidade/ /cases/ /cases/sos-truck/ /cases/tonini/ /cases/code-solution/ /sitemap.xml; do
            curl -LfsS --retry 6 --retry-delay 3 "https://www.codesolution.com.br${path}" >/tmp/page.out
          done
          curl -LfsS https://www.codesolution.com.br/ | grep -q 'cs-home-lead-form'
          curl -LfsS https://www.codesolution.com.br/assistente/ >/tmp/assistant.html
          grep -qi 'Code Solution' /tmp/assistant.html
          if grep -qi '\bCodi\b' /tmp/assistant.html; then exit 1; fi
          curl -LfsS https://www.codesolution.com.br/cases/ | grep -q 'S.O.S Truck'
          curl -LfsS https://www.codesolution.com.br/cases/ | grep -q 'Tonini'
          curl -LfsS https://www.codesolution.com.br/cases/ | grep -q 'Code Solution'

          login_http=$(curl -sS -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$login_http" = 200
          grep -q 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html

          for panel in /painel/ /painel/crm/ /painel/atendimento/ /painel/agenda/ /painel/prospeccao/ /painel/marketing/ /painel/inteligencia/ /painel/growth/ /painel/relatorios/ /painel/usuarios/; do
            h=$(mktemp); curl -sS -D "$h" -o /dev/null "https://www.codesolution.com.br${panel}"
            test "$(head -n1 "$h" | awk '{print $2}')" = 302
            grep -i '^location:' "$h" | grep -q '/painel/login/'
          done

          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.codesolution.com.br/api/auth/session)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.codesolution.com.br/api/auth/me/security)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://www.codesolution.com.br/api/auth/me/password -H 'content-type: application/json' --data '{}')" = 401

          h=$(mktemp); curl -sS -D "$h" -o /dev/null https://codesolution.com.br/
          test "$(head -n1 "$h" | awk '{print $2}')" = 301
          grep -i '^location:' "$h" | grep -q '^location: https://www.codesolution.com.br/'

      - name: Validate CRM and identity backend
        id: backend
        env:
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/summary.json -w '%{http_code}' -H "x-crm-key: ${CRM_ADMIN_KEY}" https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/crm/summary)
          test "$http" = 200
          node -e "const x=require('/tmp/summary.json');if(x.ok!==true)process.exit(1)"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/auth/session)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/auth/me/security)" = 401

      - name: Publish release summary
        if: always()
        run: |
          {
            echo '## Code Solution · Pages production release'
            echo ''
            echo '- Source: `${{ github.sha }}`'
            echo '- Cloudflare account: personal account enforced'
            echo '- Build: `${{ steps.build.outcome }}`'
            echo '- Pages secret sync: `${{ steps.secret.outcome }}`'
            echo '- Pages deploy: `${{ steps.pages.outcome }}`'
            echo '- Public smoke: `${{ steps.smoke.outcome }}`'
            echo '- CRM backend smoke: `${{ steps.backend.outcome }}`'
            echo '- CRM login: https://www.codesolution.com.br/painel/login/'
            echo '- Governance: https://www.codesolution.com.br/painel/usuarios/'
            echo '- Repository writes: disabled'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce production release
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
        run: |
          test "$BUILD" = success
          test "$CREDENTIALS" = success
          test "$SECRET" = success
          test "$PAGES" = success
          test "$SMOKE" = success
          test "$BACKEND" = success
