name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'content/blog/**'
      - 'scripts/build-static-blog.mjs'
      - 'scripts/prepare-pages.mjs'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build deploy bundle
        id: build
        continue-on-error: true
        run: |
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          test -f deploy/index.html
          test -f deploy/_headers
          test -f deploy/diagnostico/index.html
          test -f deploy/assistente/index.html
          test -f deploy/blog/ciberseguranca-e-lgpd-para-pme/index.html
          grep -q 'BlogPosting' deploy/blog/ciberseguranca-e-lgpd-para-pme/index.html
          grep -q 'SEO-FALLBACK:START' deploy/index.html

      - name: Validate Cloudflare credentials
        id: cf
        if: steps.build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets ausentes; Pages não será publicado."
          fi

      - name: Verify Pages project
        id: project
        if: steps.cf.outputs.configured == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project list --json > /tmp/pages-projects.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/pages-projects.json','utf8'));
          const list=Array.isArray(raw)?raw:(raw.result||raw.projects||[]);
          if(!list.some(p=>(p.name||p.project_name)==='codesolution-site')) {
            console.error('Pages project codesolution-site not found');
            process.exit(2);
          }
          NODE

      - name: Deploy Pages production
        id: pages
        if: steps.build.outcome == 'success' && steps.cf.outputs.configured == 'true' && steps.project.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy deploy --project-name=codesolution-site

      - name: Smoke test published site
        id: smoke
        if: steps.cf.outputs.configured == 'true' && steps.pages.outcome == 'success'
        continue-on-error: true
        run: |
          sleep 15
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.codesolution.com.br/ >/tmp/home.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.codesolution.com.br/robots.txt >/tmp/robots.txt
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.codesolution.com.br/sitemap.xml >/tmp/sitemap.xml
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.codesolution.com.br/blog/ciberseguranca-e-lgpd-para-pme/ >/tmp/article.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.codesolution.com.br/diagnostico/ >/tmp/diagnostico.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.codesolution.com.br/assistente/ >/tmp/assistente.html
          grep -qi "Cibersegurança e LGPD" /tmp/article.html
          grep -qi "BlogPosting" /tmp/article.html
          grep -qi "Diagnóstico Digital" /tmp/diagnostico.html
          grep -qi "Codi" /tmp/assistente.html
          grep -qi "Sitemap:" /tmp/robots.txt
          grep -qi "/diagnostico/" /tmp/sitemap.xml

      - name: Persist Pages deployment status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIGURED: ${{ steps.cf.outputs.configured }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          cat > docs/pages-deployment-status.json <<EOF
          {
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceCommit": "$SOURCE_SHA",
            "build": "${BUILD_OUTCOME:-skipped}",
            "cloudflareSecretsConfigured": "${CONFIGURED:-false}",
            "projectLookup": "${PROJECT_OUTCOME:-skipped}",
            "pagesDeploy": "${PAGES_OUTCOME:-skipped}",
            "publicSmokeTest": "${SMOKE_OUTCOME:-skipped}",
            "project": "codesolution-site",
            "deploymentMode": "direct-upload-production"
          }
          EOF
          git config user.name "Code Solution Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pages-deployment-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Pages deployment status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce build and deployment
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIGURED: ${{ steps.cf.outputs.configured }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$BUILD_OUTCOME" = "success"
          if [ "$CONFIGURED" = "true" ]; then
            test "$PROJECT_OUTCOME" = "success"
            test "$PAGES_OUTCOME" = "success"
            test "$SMOKE_OUTCOME" = "success"
          fi
