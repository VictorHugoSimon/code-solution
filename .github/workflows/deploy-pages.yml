name: Deploy Cloudflare Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-manual
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release bundle
        run: |
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          node --check deploy/_worker.js
          test -f deploy/setores/index.html
          test -f deploy/calculadora/index.html
          test -f deploy/diagnostico/index.html
          test -f deploy/assistente/index.html
          test -f deploy/privacidade/index.html

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project list --json >/tmp/projects.json
          project=$(node - <<'NODE'
          const x=require('/tmp/projects.json');const a=Array.isArray(x)?x:(x.result||x.projects||[]);const n=a.map(v=>v.name||v.project_name);
          process.stdout.write(n.includes('codesolution-site')?'codesolution-site':n.includes('codesolution')?'codesolution':'');
          NODE
          )
          if [ -z "$project" ]; then project=codesolution-site; npx wrangler@4 pages project create "$project" --production-branch main; fi
          echo "name=$project" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.name }}
        run: npx wrangler@4 pages deploy deploy --project-name="$PROJECT"

      - name: Smoke public routes
        run: |
          sleep 15
          for path in / /servicos/ /setores/ /calculadora/ /diagnostico/ /assistente/ /privacidade/; do
            curl -LfsS --retry 5 --retry-delay 4 "https://www.codesolution.com.br${path}" >/dev/null
          done
