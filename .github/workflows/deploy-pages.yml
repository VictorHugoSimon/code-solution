name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - 'content/blog/**'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production bundle
        id: build
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          npm run check:bundled-surfaces
          node --check deploy/_worker.js
          for file in \
            deploy/index.html \
            deploy/servicos/index.html \
            deploy/setores/index.html \
            deploy/calculadora/index.html \
            deploy/diagnostico/index.html \
            deploy/assistente/index.html \
            deploy/privacidade/index.html \
            deploy/painel/index.html \
            deploy/painel/crm/index.html \
            deploy/painel/marketing/index.html \
            deploy/painel/inteligencia/index.html; do
            test -f "$file"
          done
          grep -q "LOGIN_USERNAME = 'admin'" deploy/_worker.js
          grep -q 'LOGIN_PASSWORD_SHA256' deploy/_worker.js
          grep -qi 'Code Solution' deploy/assistente/index.html
          if grep -qi '\bCodi\b' deploy/assistente/index.html; then
            echo '::error::Legacy Codi branding found in assistant release bundle'
            exit 1
          fi

      - name: Require personal Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'

      - name: Sync CRM runtime secret to Pages
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name=codesolution-site

      - name: Deploy production
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy \
            --project-name=codesolution-site \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Code Solution production $GITHUB_SHA"

      - name: Validate public production
        id: smoke
        run: |
          set -euo pipefail
          sleep 12

          for path in / /servicos/ /setores/ /calculadora/ /diagnostico/ /assistente/ /privacidade/ /sitemap.xml; do
            curl -LfsS --retry 5 --retry-delay 3 "https://www.codesolution.com.br${path}" >/tmp/page.out
          done

          curl -LfsS https://www.codesolution.com.br/ | grep -q 'cs-home-lead-form'
          curl -LfsS https://www.codesolution.com.br/assistente/ >/tmp/assistant.html
          grep -qi 'Code Solution' /tmp/assistant.html
          if grep -qi '\bCodi\b' /tmp/assistant.html; then exit 1; fi

          login_http=$(curl -sS -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$login_http" = 200
          grep -q 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html

          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null https://www.codesolution.com.br/painel/crm/
          panel_http=$(head -n1 "$headers" | awk '{print $2}')
          panel_location=$(grep -i '^location:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$panel_http" = 302
          echo "$panel_location" | grep -q '/painel/login/'

          api_http=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)
          test "$api_http" = 401

          apex_headers=$(mktemp)
          curl -sS -D "$apex_headers" -o /dev/null https://codesolution.com.br/
          apex_http=$(head -n1 "$apex_headers" | awk '{print $2}')
          apex_location=$(grep -i '^location:' "$apex_headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$apex_http" = 301
          echo "$apex_location" | grep -q '^https://www.codesolution.com.br/'

      - name: Validate CRM backend
        id: backend
        env:
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/summary.json -w '%{http_code}' \
            -H "x-crm-key: ${CRM_ADMIN_KEY}" \
            https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/crm/summary)
          test "$http" = 200
          node -e "const x=require('/tmp/summary.json'); if(x.ok!==true) process.exit(1)"

      - name: Record Pages release
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/pages-deployment-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,
            build:e.BUILD||'failure',personalCloudflareCredentials:e.CREDENTIALS||'failure',
            crmAdminSecretSync:e.SECRET||'failure',pagesDeploy:e.PAGES||'failure',
            publicSmokeTest:e.SMOKE||'failure',crmBackendSmoke:e.BACKEND||'failure',
            project:'codesolution-site',crmLoginUrl:'https://www.codesolution.com.br/painel/login/',
            branding:'Code Solution',deploymentMode:'single-production-pipeline'
          },null,2)+'\n');
          NODE
          git config user.name 'Code Solution Pages Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/pages-deployment-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record Pages deployment status'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce production release
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
        run: |
          test "$BUILD" = success
          test "$CREDENTIALS" = success
          test "$SECRET" = success
          test "$PAGES" = success
          test "$SMOKE" = success
          test "$BACKEND" = success
