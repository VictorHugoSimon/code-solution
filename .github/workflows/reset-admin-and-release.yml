name: Reset admin and release CRM access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reset-admin-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reset-admin-and-release-crm
  cancel-in-progress: false

jobs:
  reset_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
      PROJECT: codesolution-site
      ADMIN_SALT: f6f7e142116905cf0197f39bd869fa99565eb472b3f757ea
      ADMIN_HASH: 74aa8c8bfe048f68d8d81bce8f8fd7794be0075b590d5ba0122db98893824fe0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate personal Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Reset admin credential in D1
        id: reset
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          sql="UPDATE panel_users SET role='admin',active=1,password_hash='${ADMIN_HASH}',password_salt='${ADMIN_SALT}',password_iterations=100000,session_version=session_version+1,updated_at=datetime('now') WHERE username='admin' COLLATE NOCASE; DELETE FROM panel_sessions WHERE user_id=(SELECT id FROM panel_users WHERE username='admin' COLLATE NOCASE);"
          npx wrangler@4 d1 execute code-solution-crm --remote --command="$sql" --yes >/tmp/reset.json
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,role,active,password_iterations,session_version FROM panel_users WHERE username='admin' COLLATE NOCASE;" --json >/tmp/admin.json
          node - <<'NODE'
          const fs=require('fs'); const text=fs.readFileSync('/tmp/admin.json','utf8');
          for (const expected of ['admin','100000']) if (!text.includes(expected)) throw new Error('admin credential verification failed: '+expected);
          if (!text.includes('"active": 1') && !text.includes('"active":1')) throw new Error('admin inactive');
          NODE

      - name: Build current production bundle
        id: build
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          npm run check:panel-nav
          npm run check:bundled-surfaces
          node --check deploy/_worker.js
          grep -q '/auth/login' deploy/_worker.js
          grep -q 'name="username"' deploy/_worker.js
          grep -q 'name="password"' deploy/_worker.js
          grep -q 'Acesso ao CRM' deploy/_worker.js

      - name: Sync CRM technical secret to Pages
        id: secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name="$PROJECT"

      - name: Deploy Pages production
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Admin access recovery $GITHUB_SHA"

      - name: Validate live login surface
        id: smoke
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            login_http=$(curl -sS -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/ || true)
            if [ "$login_http" = 200 ] && grep -q 'Acesso ao CRM' /tmp/login.html && grep -q 'name="username"' /tmp/login.html && grep -q 'name="password"' /tmp/login.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

          h=$(mktemp)
          curl -sS -D "$h" -o /dev/null https://www.codesolution.com.br/painel/crm/
          panel_http=$(head -n1 "$h" | awk '{print $2}')
          panel_location=$(grep -i '^location:' "$h" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$panel_http" = 302
          echo "$panel_location" | grep -q '/painel/login/'

          api_http=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)
          test "$api_http" = 401
          auth_http=$(curl -sS -o /tmp/auth.json -w '%{http_code}' https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/auth/session)
          test "$auth_http" = 401

      - name: Persist access recovery status
        if: always()
        env:
          CREDENTIALS: ${{ steps.credentials.outcome }}
          RESET: ${{ steps.reset.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git reset --hard HEAD
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/admin-access-recovery-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,
            accountId:'cad25fe6c91871bbafb58236cf9b9b81',project:'codesolution-site',
            username:'admin',passwordStoredInRepository:false,passwordAlgorithm:'PBKDF2-SHA256/100000',
            credentials:e.CREDENTIALS||'skipped',adminReset:e.RESET||'skipped',build:e.BUILD||'skipped',
            pagesSecretSync:e.SECRET||'skipped',pagesDeploy:e.DEPLOY||'skipped',liveLoginSmoke:e.SMOKE||'skipped',
            loginUrl:'https://www.codesolution.com.br/painel/login/',crmUrl:'https://www.codesolution.com.br/painel/crm/'
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution Admin Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/admin-access-recovery-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record admin access recovery"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce recovery
        if: always()
        env:
          CREDENTIALS: ${{ steps.credentials.outcome }}
          RESET: ${{ steps.reset.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          test "$CREDENTIALS" = success
          test "$RESET" = success
          test "$BUILD" = success
          test "$SECRET" = success
          test "$DEPLOY" = success
          test "$SMOKE" = success
