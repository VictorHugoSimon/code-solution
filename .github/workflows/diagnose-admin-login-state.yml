# Admin access diagnostic marker: 2026-08-27 rotated credential validation
name: Diagnose admin login state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-admin-login-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'

      - name: Read safe admin state from D1
        id: state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,display_name,role,active,session_version,last_login_at,updated_at,password_iterations,CASE WHEN password_hash='cff8e7c602d8fc4057f8726f677e2bd2425d25477bec7929c1283d7546437269' AND password_salt='fa516c0b7656ed3f16fc0a2043e3ee63b247dc5da33e2023' THEN 1 ELSE 0 END AS rotation_hash_matches FROM panel_users WHERE username='admin' COLLATE NOCASE LIMIT 1;" --json > /tmp/admin-user.json
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT action,COUNT(*) AS total,MAX(created_at) AS last_at FROM panel_audit_log WHERE username='admin' OR action IN ('admin_password_recovery_persisted_2026_08_27','admin_recovery_2026_08_27_existing_password_consumed','bootstrap_known_password_consumed','login_success','login_failure','admin_password_rotation_2026_08_27_owner_approved') GROUP BY action ORDER BY action;" --json > /tmp/admin-audit.json

          node - <<'NODE'
          const fs=require('fs');
          function rows(path){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const a=Array.isArray(x)?x:(x.result||[]);
            if(Array.isArray(a[0]?.results)) return a[0].results;
            if(Array.isArray(a?.results)) return a.results;
            return [];
          }
          const users=rows('/tmp/admin-user.json');
          const audits=rows('/tmp/admin-audit.json');
          const u=users[0]||null;
          const persisted=audits.find(x=>x.action==='admin_password_recovery_persisted_2026_08_27');
          const rotation=audits.find(x=>x.action==='admin_password_rotation_2026_08_27_owner_approved');
          const recovery=audits.find(x=>x.action==='admin_recovery_2026_08_27_existing_password_consumed');
          const bootstrap=audits.find(x=>x.action==='bootstrap_known_password_consumed');
          const loginSuccess=audits.find(x=>x.action==='login_success');
          const loginFailure=audits.find(x=>x.action==='login_failure');
          const persistentCredentialSet=Number(persisted?.total||0)>0;
          const credentialRotationApplied=Number(rotation?.total||0)>0;
          const recoveryConsumed=Number(recovery?.total||0)>0;
          const bootstrapConsumed=Number(bootstrap?.total||0)>0;
          const out={
            checkedAt:new Date().toISOString(),
            username:'admin',
            userExists:Boolean(u),
            displayName:u?.display_name||'',
            role:u?.role||'',
            active:Boolean(Number(u?.active||0)),
            sessionVersion:Number(u?.session_version||0),
            lastLoginAt:u?.last_login_at||null,
            updatedAt:u?.updated_at||null,
            passwordIterations:Number(u?.password_iterations||0),
            rotatedCredentialMatches:Boolean(Number(u?.rotation_hash_matches||0)),
            credentialRotationApplied,
            credentialRotationAppliedAt:rotation?.last_at||null,
            persistentCredentialSet,
            persistentCredentialSetAt:persisted?.last_at||null,
            recoveryConsumed,
            recoveryLastAt:recovery?.last_at||null,
            bootstrapConsumed,
            bootstrapLastAt:bootstrap?.last_at||null,
            loginSuccessCount:Number(loginSuccess?.total||0),
            lastLoginSuccessAt:loginSuccess?.last_at||null,
            loginFailureCount:Number(loginFailure?.total||0),
            lastLoginFailureAt:loginFailure?.last_at||null,
            knownCredentialReady:credentialRotationApplied && Boolean(Number(u?.rotation_hash_matches||0)),
            credentialState:credentialRotationApplied?'rotated-admin':'persistent-admin',
            plaintextPasswordStored:false
          };
          fs.mkdirSync('docs',{recursive:true});
          fs.writeFileSync('docs/admin-login-state.json',JSON.stringify(out,null,2)+'\n');
          if(!out.userExists || !out.active || out.role!=='admin' || out.passwordIterations<180000 || !out.rotatedCredentialMatches || !out.credentialRotationApplied) process.exit(2);
          NODE

      - name: Persist diagnostic
        run: |
          git config user.name 'Code Solution Admin Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/admin-login-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record admin login state'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
