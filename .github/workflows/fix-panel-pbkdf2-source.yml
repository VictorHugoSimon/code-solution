name: Normalize panel PBKDF2 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panel-pbkdf2-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize auth iteration limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'robo/panel-auth.js': [
              ('const DEFAULT_ITERATIONS = 180000;', 'const DEFAULT_ITERATIONS = 100000;'),
            ],
            'robo/panel-auth-enhancements.js': [
              ('const PASSWORD_ITERATIONS = 180000;', 'const PASSWORD_ITERATIONS = 100000;'),
            ],
            'crm/migrations/0004_panel_identity.sql': [
              ('password_iterations INTEGER NOT NULL DEFAULT 180000,', 'password_iterations INTEGER NOT NULL DEFAULT 100000,'),
            ],
          }
          for name, pairs in replacements.items():
            p = Path(name)
            text = p.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'missing expected source marker in {name}: {old}')
              text = text.replace(old, new)
            p.write_text(text)
          PY
          grep -q 'DEFAULT_ITERATIONS = 100000' robo/panel-auth.js
          grep -q 'PASSWORD_ITERATIONS = 100000' robo/panel-auth-enhancements.js
          grep -q 'DEFAULT 100000' crm/migrations/0004_panel_identity.sql
          if grep -q 'DEFAULT_ITERATIONS = 180000' robo/panel-auth.js; then exit 1; fi
          if grep -q 'PASSWORD_ITERATIONS = 180000' robo/panel-auth-enhancements.js; then exit 1; fi
      - name: Commit normalized auth source
        run: |
          git config user.name "Code Solution Auth Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add robo/panel-auth.js robo/panel-auth-enhancements.js crm/migrations/0004_panel_identity.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: cap panel PBKDF2 at Cloudflare limit"
          git pull --rebase origin main
          git push origin HEAD:main
