name: Release Code Solution Pages now

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-solution-pages-recovery
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate versioned production bundle
        id: build
        run: |
          set -euo pipefail
          node --check deploy/_worker.js
          test -f deploy/index.html
          test -f deploy/painel/crm/index.html
          grep -q '/auth/login' deploy/_worker.js
          grep -q "form?.get('username')" deploy/_worker.js
          grep -q "form?.get('password')" deploy/_worker.js
          grep -q 'Acesso ao CRM' deploy/_worker.js
          grep -q 'Entrar no CRM' deploy/_worker.js

      - name: Require personal Cloudflare account
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "cad25fe6c91871bbafb58236cf9b9b81"

      - name: Sync CRM server secret to Pages
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name=codesolution-site

      - name: Deploy versioned production Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy --project-name=codesolution-site --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Manual CRM access recovery $GITHUB_SHA"

      - name: Validate live CRM access surface
        id: smoke
        run: |
          set -euo pipefail
          sleep 18
          login_http=$(curl -sS --retry 6 --retry-delay 4 -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$login_http" = 200
          grep -qi 'Acesso ao CRM' /tmp/login.html
          grep -qi 'name="username"' /tmp/login.html
          grep -qi 'name="password"' /tmp/login.html
          grep -qi 'Entrar no CRM' /tmp/login.html

          h=$(mktemp)
          curl -sS -D "$h" -o /dev/null https://www.codesolution.com.br/painel/crm/
          panel_http=$(head -n1 "$h" | awk '{print $2}')
          panel_location=$(grep -i '^location:' "$h" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$panel_http" = 302
          echo "$panel_location" | grep -q '/painel/login/'

          api_http=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)
          test "$api_http" = 401

      - name: Validate CRM backend secret
        id: backend
        env:
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/summary.json -w '%{http_code}' -H "x-crm-key: ${CRM_ADMIN_KEY}" https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/crm/summary)
          test "$http" = 200
          node -e "const x=require('/tmp/summary.json'); if(x.ok!==true) process.exit(1)"

      - name: Persist recovery status
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/pages-direct-release-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,
            build:e.BUILD||'failure',crmAdminSecretSync:e.SECRET||'skipped',pagesDeploy:e.DEPLOY||'skipped',
            crmLoginSmoke:e.SMOKE||'skipped',crmBackendAuth:e.BACKEND||'skipped',
            crmLoginUrl:'https://www.codesolution.com.br/painel/login/',
            authModel:'backend-session-via-auth-login',cloudflareAccountId:'cad25fe6c91871bbafb58236cf9b9b81'
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pages-direct-release-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record CRM Pages recovery status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Enforce recovery release
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
        run: |
          test "$BUILD" = success
          test "$SECRET" = success
          test "$DEPLOY" = success
          test "$SMOKE" = success
          test "$BACKEND" = success
