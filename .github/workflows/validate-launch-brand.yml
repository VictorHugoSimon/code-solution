name: Validate launch branding

# Explicit re-run after workflow registration on main — 2026-08-24.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-launch-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate live brand with propagation retries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const pageUrl = 'https://www.codesolution.com.br/assistente/';
          const chatUrl = 'https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/chat';
          let result = {checkedAt:new Date().toISOString(),sourceCommit:process.env.GITHUB_SHA,page:'failed',chat:'failed',legacyCodiVisible:true,chatLegacyCodi:true,attempts:0};
          for (let attempt=1; attempt<=12; attempt++) {
            result.attempts = attempt;
            try {
              const p = await fetch(pageUrl, {redirect:'follow', signal:AbortSignal.timeout(20000)});
              const html = await p.text();
              result.pageHttp = p.status;
              result.page = p.ok && /Code Solution/i.test(html) ? 'success' : 'failed';
              result.legacyCodiVisible = /\bCodi\b/.test(html);
            } catch (e) { result.pageError = String(e.message || e).slice(0,160); }
            try {
              const c = await fetch(chatUrl, {
                method:'POST',
                headers:{'content-type':'application/json','origin':'https://www.codesolution.com.br'},
                body:JSON.stringify({messages:[{role:'user',content:'Olá, como você se chama e como pode ajudar minha empresa?'}],context:{source:'launch_brand_validation',consent:true}}),
                signal:AbortSignal.timeout(35000)
              });
              const j = await c.json();
              result.chatHttp = c.status;
              result.chat = c.status===200 && j.ok===true && typeof j.message==='string' && j.message.length>10 ? 'success' : 'failed';
              result.chatLegacyCodi = /\bCodi\b/.test(String(j.message||''));
              result.provider = String(j.provider||'');
              result.runtimeBuild = String(j.runtimeBuild||'');
            } catch (e) { result.chatError = String(e.message || e).slice(0,160); }
            if (result.page==='success' && result.chat==='success' && result.legacyCodiVisible===false && result.chatLegacyCodi===false) break;
            await sleep(5000);
          }
          result.checkedAt = new Date().toISOString();
          result.overall = result.page==='success' && result.chat==='success' && result.legacyCodiVisible===false && result.chatLegacyCodi===false ? 'success' : 'failed';
          fs.mkdirSync('docs',{recursive:true});
          fs.writeFileSync('docs/launch-brand-status.json', JSON.stringify(result,null,2)+'\n');
          if (result.overall!=='success') throw new Error('Live branding validation failed');
          NODE
      - name: Persist validation
        if: always()
        run: |
          git config user.name "Code Solution Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/launch-brand-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record launch branding status"
          git pull --rebase origin main
          git push origin HEAD:main
