name: Refresh panel identity status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-panel-identity-status.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-panel-identity-status
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATTENDANT: https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and D1
        id: source
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"
          node --check robo/panel-auth.js
          node --check robo/panel-auth-enhancements.js
          node --check robo/atendente-auth-growth-runtime.js
          python3 scripts/check-crm-schema.py
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,role,active,password_iterations FROM panel_users WHERE username='admin';" --json >/tmp/admin.json
          grep -q 'admin' /tmp/admin.json
          grep -q '100000' /tmp/admin.json

      - name: Exercise ephemeral login/session/logout
        id: lifecycle
        continue-on-error: true
        if: steps.source.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          suffix=$(node -e "process.stdout.write(crypto.randomUUID().replace(/-/g,'').slice(0,12))")
          user="ci_${suffix}"; user_id="ci-${user}"; pass="Ci!${suffix}Aa9#Governance"
          export USERNAME="$user" USER_ID="$user_id" PASSWORD="$pass"
          sql=$(node - <<'NODE'
          const {pbkdf2Sync,randomBytes}=require('crypto');
          const user=process.env.USERNAME,id=process.env.USER_ID,pass=process.env.PASSWORD,salt=randomBytes(24),iterations=100000;
          const hash=pbkdf2Sync(pass,salt,iterations,32,'sha256').toString('hex');
          const esc=s=>String(s).replace(/'/g,"''");
          process.stdout.write(`INSERT INTO panel_users (id,username,display_name,role,password_hash,password_salt,password_iterations,active,session_version,created_at,updated_at) VALUES ('${esc(id)}','${esc(user)}','CI Governance','leitura_executiva','${hash}','${salt.toString('hex')}',${iterations},1,1,datetime('now'),datetime('now'));`);
          NODE
          )
          npx wrangler@4 d1 execute code-solution-crm --remote --command="$sql" --yes >/dev/null
          cleanup(){ npx wrangler@4 d1 execute code-solution-crm --remote --command="DELETE FROM panel_sessions WHERE user_id='${user_id}'; DELETE FROM panel_audit_log WHERE user_id='${user_id}' OR username='${user}'; DELETE FROM panel_users WHERE id='${user_id}';" --yes >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          login=$(curl -sS -o /tmp/login.json -w '%{http_code}' "$ATTENDANT/auth/login" -H 'content-type: application/json' --data "{\"username\":\"${user}\",\"password\":\"${pass}\"}")
          test "$login" = 200
          token=$(node -e "const x=require('/tmp/login.json');if(x.ok!==true||!x.token)process.exit(2);process.stdout.write(x.token)")
          session=$(curl -sS -o /tmp/session.json -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token}")
          test "$session" = 200
          USERNAME="$user" node -e "const x=require('/tmp/session.json');if(x.ok!==true||x.user?.username!==process.env.USERNAME||x.user?.role!=='leitura_executiva')process.exit(2)"
          logout=$(curl -sS -o /tmp/logout.json -w '%{http_code}' -X POST "$ATTENDANT/auth/logout" -H "authorization: Bearer ${token}")
          test "$logout" = 200
          revoked=$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token}")
          test "$revoked" = 401

      - name: Persist final identity evidence
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          const ok=e.SOURCE_OUTCOME==='success'&&e.LIFECYCLE_OUTCOME==='success';
          fs.writeFileSync('docs/panel-identity-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,status:ok?'success':'failure',
            sourceAndSchema:e.SOURCE_OUTCOME||'failure',identityLifecycle:e.LIFECYCLE_OUTCOME||'failure',
            ephemeralUserRemoved:true,plaintextPasswordCommitted:false,pbkdf2Iterations:100000,
            roles:['admin','comercial','marketing','leitura_executiva'],sessionModel:'opaque-revocable-d1'
          },null,2)+'\n');
          NODE
          git config user.name 'Code Solution Identity Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/panel-identity-status.json
          git commit -m 'chore: refresh panel identity status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce identity validation
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: |
          test "$SOURCE_OUTCOME" = success
          test "$LIFECYCLE_OUTCOME" = success
