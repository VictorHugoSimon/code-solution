name: Diagnose Worker runtime secrets

# Re-run marker: CRM_ADMIN_KEY sync verification 2026-08-24
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-worker-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-worker-runtime
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect configured Worker secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          npx wrangler@4 secret list --config robo/wrangler.toml --format json > /tmp/content-secrets.json
          npx wrangler@4 secret list --config robo/wrangler-atendente.toml --format json > /tmp/attendant-secrets.json

          node - <<'NODE'
          const fs = require('fs');
          const names = (path) => {
            const raw = JSON.parse(fs.readFileSync(path, 'utf8'));
            const list = Array.isArray(raw) ? raw : (raw.result || raw.secrets || []);
            return new Set(list.map((x) => String(x.name || '')).filter(Boolean));
          };
          const c = names('/tmp/content-secrets.json');
          const a = names('/tmp/attendant-secrets.json');
          const out = {
            checkedAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            contentWorker: {
              AI_API_KEY: c.has('AI_API_KEY'),
              GITHUB_TOKEN: c.has('GITHUB_TOKEN'),
              MANUAL_KEY: c.has('MANUAL_KEY'),
              AI_MODEL_SECRET: c.has('AI_MODEL')
            },
            attendantWorker: {
              AI_API_KEY: a.has('AI_API_KEY'),
              AI_MODEL_SECRET: a.has('AI_MODEL'),
              CRM_ADMIN_KEY: a.has('CRM_ADMIN_KEY'),
              WHATSAPP_TOKEN: a.has('WHATSAPP_TOKEN'),
              WHATSAPP_PHONE_ID: a.has('WHATSAPP_PHONE_ID'),
              OWNER_WHATSAPP: a.has('OWNER_WHATSAPP')
            }
          };
          fs.mkdirSync('docs', { recursive: true });
          fs.writeFileSync('docs/runtime-secrets-status.json', JSON.stringify(out, null, 2) + '\n');
          NODE

      - name: Persist runtime secret status
        run: |
          git config user.name "Code Solution Runtime Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/runtime-secrets-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Worker runtime secret status"
          git pull --rebase origin main
          git push origin HEAD:main
