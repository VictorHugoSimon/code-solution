name: Generate Code Solution organic blog

on:
  schedule:
    - cron: '0 12 * * 2,5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-blog-workers-ai.mjs'
      - '.github/workflows/generate-organic-blog.yml'

permissions:
  contents: write

concurrency:
  group: code-solution-organic-blog
  cancel-in-progress: false

env:
  EXPECTED_ACCOUNT_ID: cad25fe6c91871bbafb58236cf9b9b81
  WORKERS_AI_MODEL: '@cf/meta/llama-3.1-8b-instruct-fast'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"

      - name: Generate multilingual article with Workers AI
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/generate-blog-workers-ai.mjs

      - name: Validate and rebuild blog index
        run: |
          set -euo pipefail
          npm run blog:index
          node - <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('content/blog').filter(f=>f.endsWith('.json')&&f!=='index.json');
          if(files.length<1) throw new Error('No blog article generated');
          const newest=files.map(f=>({f,t:fs.statSync('content/blog/'+f).mtimeMs})).sort((a,b)=>b.t-a.t)[0].f;
          const x=JSON.parse(fs.readFileSync('content/blog/'+newest,'utf8'));
          for(const l of ['pt','en','es']) {
            if(!x[l]?.title || !x[l]?.body || x[l].body.length<2500) throw new Error(`invalid locale ${l}`);
          }
          if(/\bCodi\b/i.test(JSON.stringify(x))) throw new Error('Legacy assistant branding found');
          console.log('Validated',newest);
          NODE

      - name: Commit article with ephemeral GitHub Actions token
        run: |
          set -euo pipefail
          git config user.name "Code Solution Organic Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog
          if git diff --cached --quiet; then
            echo 'No article changes to publish.'
            exit 0
          fi
          git commit -m "content: publish organic Code Solution article"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo '## Code Solution organic content' >> "$GITHUB_STEP_SUMMARY"
          echo '- Generator: Cloudflare Workers AI REST' >> "$GITHUB_STEP_SUMMARY"
          echo '- Repository write: ephemeral GitHub Actions token' >> "$GITHUB_STEP_SUMMARY"
          echo '- Personal GitHub PAT required: no' >> "$GITHUB_STEP_SUMMARY"
          echo '- Downstream: content-integrity rebuilds static blog and Pages release' >> "$GITHUB_STEP_SUMMARY"
