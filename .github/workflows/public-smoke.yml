name: Public production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-smoke.yml'
      - 'robo/**'
      - 'deploy/**'
      - 'scripts/rebrand-code-solution.mjs'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: public-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate public production and Code Solution branding
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pages = [
            ['home','https://www.codesolution.com.br/','Code Solution'],
            ['services','https://www.codesolution.com.br/servicos/','Servi'],
            ['staticArticle','https://www.codesolution.com.br/blog/ciberseguranca-e-lgpd-para-pme/','Cibersegurança e LGPD'],
            ['diagnosticLanding','https://www.codesolution.com.br/diagnostico/','Diagnóstico Digital'],
            ['standaloneAssistant','https://www.codesolution.com.br/assistente/','Code Solution'],
            ['privacyPage','https://www.codesolution.com.br/privacidade/','Privacidade'],
            ['sectorsPage','https://www.codesolution.com.br/setores/','Sistemas sob medida para o agronegócio'],
            ['calculatorPage','https://www.codesolution.com.br/calculadora/','Quanto custa construir seu sistema'],
          ];
          const out = {
            checkedAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            cloudflareApiTokenPresent: process.env.CF_TOKEN_PRESENT === 'true',
            cloudflareAccountIdPresent: process.env.CF_ACCOUNT_PRESENT === 'true',
          };
          const bodies = {};
          for (const [key,url,pattern] of pages) {
            try {
              const r = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(20000) });
              const text = await r.text();
              bodies[key] = text;
              out[key] = r.ok && text.toLowerCase().includes(pattern.toLowerCase()) ? 'success' : 'failed';
            } catch { out[key] = 'failed'; }
          }
          out.homeLeadCapture = /cs-home-lead-form/.test(bodies.home || '') ? 'success' : 'failed';
          out.homeGuidedJourney = /data-cs-home-journey/.test(bodies.home || '') && /Enviar e ver meu próximo passo/.test(bodies.home || '') && /home-journey\.js/.test(bodies.home || '') ? 'success' : 'failed';
          out.servicesAeo = /cs-services-aeo/.test(bodies.services || '') ? 'success' : 'failed';
          out.assistantBranding = /Code Solution/i.test(bodies.standaloneAssistant || '') && !/\bCodi\b/.test(bodies.standaloneAssistant || '') ? 'success' : 'failed';
          out.publicBrandingLegacyAbsent = Object.values(bodies).every((text) => !/\bCodi\b/.test(text)) ? 'success' : 'failed';

          try {
            const r = await fetch('https://www.codesolution.com.br/home-journey.js', { signal: AbortSignal.timeout(20000) });
            const text = await r.text();
            out.homeJourneyRuntimeHttp = String(r.status);
            out.homeJourneyRuntime = r.ok && /code-solution-atendente\.victorhugoteixeirasimon6\.workers\.dev/.test(text) && /fetch\(API \+ '\/lead'/.test(text) && /generate_lead/.test(text) && /site_home_journey/.test(text) ? 'success' : 'failed';
          } catch { out.homeJourneyRuntime = 'failed'; out.homeJourneyRuntimeHttp = ''; }

          try {
            const apex = await fetch('https://codesolution.com.br/', { redirect: 'manual', signal: AbortSignal.timeout(20000) });
            out.apexHttp = String(apex.status);
            out.apexLocation = apex.headers.get('location') || '';
            out.apexCanonicalRedirect = apex.status === 301 && out.apexLocation.startsWith('https://www.codesolution.com.br/') ? 'success' : 'failed';
          } catch {
            out.apexHttp = '';
            out.apexLocation = '';
            out.apexCanonicalRedirect = 'failed';
          }

          const contentBase = 'https://code-solution-robo.victorhugoteixeirasimon6.workers.dev';
          const attendantBase = 'https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev';
          try {
            const r = await fetch(`${contentBase}/health`, { signal: AbortSignal.timeout(20000) });
            const j = await r.json();
            out.contentWorkerHealth = r.ok && j.ready === true ? 'success' : 'failed';
            out.contentWorkerBuild = String(j.build || '');
            out.contentWorkerReady = String(j.ready ?? '');
          } catch { out.contentWorkerHealth = 'failed'; }

          try {
            const r = await fetch(`${attendantBase}/health`, { signal: AbortSignal.timeout(20000) });
            const j = await r.json();
            out.attendantWorkerHealth = r.ok ? 'success' : 'failed';
            out.attendantStorage = String(j.storage || '');
          } catch { out.attendantWorkerHealth = 'failed'; }

          try {
            const r = await fetch(`${attendantBase}/chat`, {
              method: 'POST',
              headers: {'content-type':'application/json','origin':'https://www.codesolution.com.br'},
              body: JSON.stringify({messages:[{role:'user',content:'Olá. Como a Code Solution pode ajudar minha empresa com automação?'}],context:{source:'production_smoke',consent:true}}),
              signal: AbortSignal.timeout(35000),
            });
            const j = await r.json();
            out.attendantChatHttp = String(r.status);
            out.attendantChat = r.status === 200 && j.ok === true && typeof j.message === 'string' && j.message.length > 10 ? 'success' : 'failed';
            out.chatBranding = out.attendantChat === 'success' && !/\bCodi\b/.test(String(j.message || '')) ? 'success' : 'failed';
            out.attendantProvider = String(j.provider || '');
            out.attendantRuntimeBuild = String(j.runtimeBuild || '');
          } catch { out.attendantChat = 'failed'; out.chatBranding = 'failed'; out.attendantChatHttp = ''; }

          try {
            const r = await fetch(`${attendantBase}/lead`, {
              method:'POST', headers:{'content-type':'application/json','origin':'https://www.codesolution.com.br'},
              body: JSON.stringify({name:'',whatsapp:'',need:''}), signal: AbortSignal.timeout(20000),
            });
            const j = await r.json();
            out.attendantLeadValidationHttp = String(r.status);
            out.attendantLeadValidationError = String(j.error || '');
            out.attendantLeadValidation = r.status === 400 && j.error === 'validation_error' ? 'success' : 'failed';
          } catch { out.attendantLeadValidation = 'failed'; }

          try {
            const r = await fetch(`${attendantBase}/crm/summary`, { signal: AbortSignal.timeout(20000) });
            out.crmAnonymousHttp = String(r.status);
            out.crmAnonymousProtection = r.status === 401 ? 'success' : 'failed';
          } catch { out.crmAnonymousProtection = 'failed'; }

          try {
            const r = await fetch(`${attendantBase}/auth/me/security`, { signal: AbortSignal.timeout(20000) });
            out.panelSecurityAnonymousHttp = String(r.status);
            out.panelSecurityAnonymousProtection = r.status === 401 ? 'success' : 'failed';
          } catch { out.panelSecurityAnonymousProtection = 'failed'; }

          const required = [
            'home','services','homeLeadCapture','homeGuidedJourney','homeJourneyRuntime','servicesAeo','staticArticle','diagnosticLanding','standaloneAssistant','privacyPage','sectorsPage','calculatorPage',
            'assistantBranding','publicBrandingLegacyAbsent','apexCanonicalRedirect','contentWorkerHealth','attendantWorkerHealth','attendantChat','chatBranding','attendantLeadValidation','crmAnonymousProtection','panelSecurityAnonymousProtection'
          ];
          const failed = required.filter((k) => out[k] !== 'success');
          out.overall = failed.length ? 'failed' : 'success';
          out.failedChecks = failed;
          fs.mkdirSync('/tmp/code-solution-smoke', { recursive: true });
          fs.writeFileSync('/tmp/code-solution-smoke/public-smoke-status.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          if (failed.length) throw new Error(`Production smoke failed: ${failed.join(', ')}`);
          NODE

      - name: Publish smoke summary
        if: always()
        run: |
          {
            echo '## Code Solution · Public production smoke'
            echo ''
            echo '- Production URL: https://www.codesolution.com.br/'
            echo '- Source: `${{ github.sha }}`'
            echo '- Guided Home journey + external runtime are mandatory gates.'
            echo '- This workflow is read-only and never commits status files.'
          } >> "$GITHUB_STEP_SUMMARY"
