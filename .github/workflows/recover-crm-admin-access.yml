name: Recover CRM admin access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-crm-admin-access.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
  PASSWORD_HASH: 855360462da1db3cd1261e4cf9dd50b1a4e36e4dc3ece55c7f40b9147e45409c
  PASSWORD_SALT: 772dd1275076f31d23d16306be8cf9674c2484795968e083
  PASSWORD_ITERATIONS: '180000'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Reset admin credential and clear active lock window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sql="INSERT INTO panel_users (id,username,display_name,role,password_hash,password_salt,password_iterations,active,session_version,created_at,updated_at) VALUES ('panel-admin-primary','admin','Administrador Code Solution','admin','${PASSWORD_HASH}','${PASSWORD_SALT}',${PASSWORD_ITERATIONS},1,1,datetime('now'),datetime('now')) ON CONFLICT(username) DO UPDATE SET display_name='Administrador Code Solution',role='admin',password_hash=excluded.password_hash,password_salt=excluded.password_salt,password_iterations=excluded.password_iterations,active=1,session_version=panel_users.session_version+1,updated_at=datetime('now'); UPDATE panel_sessions SET revoked_at=datetime('now') WHERE user_id=(SELECT id FROM panel_users WHERE username='admin' COLLATE NOCASE) AND revoked_at IS NULL; UPDATE panel_audit_log SET action='login_failure_pre_reset' WHERE username='admin' COLLATE NOCASE AND action='login_failure' AND created_at>=datetime('now','-30 minutes'); INSERT INTO panel_audit_log (id,user_id,username,action,target_type,target_id,metadata_json,created_at) VALUES (lower(hex(randomblob(16))),(SELECT id FROM panel_users WHERE username='admin' COLLATE NOCASE),'admin','credential_reset','panel_user',(SELECT id FROM panel_users WHERE username='admin' COLLATE NOCASE),'{\"source\":\"crm-access-recovery\"}',datetime('now'));"
          npx wrangler@4 d1 execute code-solution-crm --remote --command="$sql" --yes

      - name: Verify admin record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,role,active,password_hash,password_salt,password_iterations,session_version,updated_at FROM panel_users WHERE username='admin' COLLATE NOCASE LIMIT 1;" --json >/tmp/admin.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/admin.json','utf8'));
          const rows=[];
          const walk=v=>{if(Array.isArray(v)) for(const e of v) walk(e); else if(v&&typeof v==='object'){if(Array.isArray(v.results)) rows.push(...v.results); for(const e of Object.values(v)) walk(e)}};
          walk(x);
          const row=rows.find(r=>String(r.username||'').toLowerCase()==='admin');
          if(!row) throw new Error('admin row not found');
          if(row.role!=='admin'||Number(row.active)!==1) throw new Error('admin role/active invalid');
          if(row.password_hash!==process.env.PASSWORD_HASH) throw new Error('password hash mismatch');
          if(row.password_salt!==process.env.PASSWORD_SALT) throw new Error('password salt mismatch');
          if(Number(row.password_iterations)!==Number(process.env.PASSWORD_ITERATIONS)) throw new Error('iterations mismatch');
          console.log('Admin credential material verified in production D1.');
          NODE

      - name: Verify live login surfaces and auth route
        run: |
          set -euo pipefail
          login_http=$(curl -sS -L --retry 4 --retry-delay 3 -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          echo "LOGIN_HTTP=$login_http"
          echo "LOGIN_BODY=$(tr '\n' ' ' </tmp/login.html | head -c 220)"
          auth_http=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X POST https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/auth/login -H 'content-type: application/json' --data '{"username":"admin","password":"definitely-wrong-password"}')
          echo "AUTH_HTTP=$auth_http"
          echo "AUTH_BODY=$(cat /tmp/auth.json | head -c 220)"
          test "$login_http" = 200
          grep -qi 'Acesso ao CRM' /tmp/login.html
          test "$auth_http" = 401
          grep -q 'invalid_credentials' /tmp/auth.json
          echo 'Login page and authentication route are live.'
