name: Fix Super Admin panel access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-super-admin-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-super-admin-panel
  cancel-in-progress: false

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Pages authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deploy/_worker.js')
          s=p.read_text()
          s=s.replace(
            "if (isPanel && !panelAllowed(url.pathname, session.permissions || [])) return forbiddenPage(session.user);",
            "if (isPanel && !panelAllowed(url.pathname, session.permissions || [], session.user?.role)) return forbiddenPage(session.user);"
          )
          s=s.replace(
            "const allowedDestination = panelAllowed(new URL(destination, url.origin).pathname, data.permissions || []) ? destination : '/painel/';",
            "const allowedDestination = panelAllowed(new URL(destination, url.origin).pathname, data.permissions || [], data.user?.role) ? destination : '/painel/';"
          )
          old="""function panelAllowed(pathname, permissions) {
  const p = new Set(permissions);
  if (pathname === '/painel' || pathname === '/painel/') return p.has('overview');
  if (pathname.startsWith('/painel/usuarios')) return p.has('users');
  if (pathname.startsWith('/painel/crm')) return p.has('crm_read');
  if (pathname.startsWith('/painel/atendimento')) return p.has('attendance');
  if (pathname.startsWith('/painel/agenda')) return p.has('agenda');
  if (pathname.startsWith('/painel/prospeccao')) return p.has('prospecting');
  if (pathname.startsWith('/painel/marketing')) return p.has('marketing');
  if (pathname.startsWith('/painel/inteligencia')) return p.has('intelligence');
  if (pathname.startsWith('/painel/growth')) return p.has('growth');
  if (pathname.startsWith('/painel/relatorios')) return p.has('reports');
  return false;
}"""
          new="""function panelAllowed(pathname, permissions, role = '') {
  // Super Admin: acesso integral a qualquer módulo autenticado do painel.
  // Isso evita 403 em módulos novos ainda não mapeados individualmente.
  if (role === 'admin' && (pathname === '/painel' || pathname.startsWith('/painel/'))) return true;

  const p = new Set(permissions);
  if (pathname === '/painel' || pathname === '/painel/') return p.has('overview');
  if (pathname.startsWith('/painel/usuarios')) return p.has('users');
  if (pathname.startsWith('/painel/crm')) return p.has('crm_read');
  if (pathname.startsWith('/painel/atendimento')) return p.has('attendance');
  if (pathname.startsWith('/painel/agenda')) return p.has('agenda');
  if (pathname.startsWith('/painel/prospeccao')) return p.has('prospecting');
  if (pathname.startsWith('/painel/marketing')) return p.has('marketing');
  if (pathname.startsWith('/painel/inteligencia')) return p.has('intelligence');
  if (pathname.startsWith('/painel/growth')) return p.has('growth');
  if (pathname.startsWith('/painel/relatorios')) return p.has('reports');
  if (pathname.startsWith('/painel/conta')) return p.has('overview');
  if (pathname.startsWith('/painel/delivery')) return p.has('reports');
  if (pathname.startsWith('/painel/executivo')) return p.has('reports');
  return false;
}"""
          if old not in s:
            raise SystemExit('panelAllowed original block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check deploy/_worker.js
          grep -q "role === 'admin'" deploy/_worker.js
          grep -q "/painel/conta" deploy/_worker.js
          grep -q "/painel/delivery" deploy/_worker.js
          grep -q "/painel/executivo" deploy/_worker.js

      - name: Verify canonical admin role in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,role,active FROM panel_users WHERE username='admin' COLLATE NOCASE LIMIT 1;" --json > /tmp/admin.json
          node - <<'NODE'
          const x=require('/tmp/admin.json');
          const a=Array.isArray(x)?x:(x.result||[]);
          const rows=Array.isArray(a[0]?.results)?a[0].results:(a.results||[]);
          const u=rows[0]||{};
          if(u.username!=='admin'||u.role!=='admin'||Number(u.active)!==1){console.error(u);process.exit(1)}
          NODE

      - name: Commit authorization fix
        run: |
          git config user.name "Code Solution Access Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy/_worker.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: grant Super Admin access to every panel module"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy Pages hotfix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'
          npx wrangler@4 pages deploy deploy --project-name=codesolution-site --commit-message="Super Admin panel access hotfix"

      - name: Validate public auth boundary
        run: |
          set -euo pipefail
          sleep 10
          login_http=$(curl -sS -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$login_http" = 200
          grep -qi 'Acesso ao CRM' /tmp/login.html
          for path in conta delivery executivo crm marketing inteligencia growth relatorios usuarios; do
            h=$(mktemp)
            curl -sS -D "$h" -o /dev/null "https://www.codesolution.com.br/painel/${path}/"
            code=$(head -n1 "$h" | awk '{print $2}')
            loc=$(grep -i '^location:' "$h" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
            test "$code" = 302
            echo "$loc" | grep -q '/painel/login/'
          done
