name: Recover CRM login production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-pages-login.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-crm-login-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production inputs
        id: validate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "cad25fe6c91871bbafb58236cf9b9b81"
          test -f deploy/_worker.js
          grep -q "LOGIN_USERNAME = 'admin'" deploy/_worker.js
          grep -q "LOGIN_PASSWORD_SHA256" deploy/_worker.js
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Sync CRM session secret to Pages
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name=codesolution-site

      - name: Deploy Pages production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy --project-name=codesolution-site --commit-hash="$GITHUB_SHA" --commit-message="Recover CRM login $GITHUB_SHA"

      - name: Validate public CRM access flow
        id: smoke
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            login_http=$(curl -sS -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/ || true)
            if [ "$login_http" = 200 ] && grep -qi 'Acesso ao CRM' /tmp/login.html && grep -q 'name="username"' /tmp/login.html; then
              break
            fi
            sleep 5
          done
          test "$login_http" = 200
          grep -qi 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html

          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null https://www.codesolution.com.br/painel/crm/
          panel_http=$(head -n1 "$headers" | awk '{print $2}')
          panel_location=$(grep -i '^location:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$panel_http" = 302
          echo "$panel_location" | grep -q '/painel/login/'

          api_http=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)
          test "$api_http" = 401

      - name: Persist recovery result
        if: always()
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/crm-login-release-status.json', JSON.stringify({
            checkedAt:new Date().toISOString(),
            sourceCommit:e.SOURCE_SHA,
            validate:e.VALIDATE||'skipped',
            crmAdminSecretSync:e.SECRET||'skipped',
            pagesDeploy:e.DEPLOY||'skipped',
            publicLoginSmoke:e.SMOKE||'skipped',
            loginUrl:'https://www.codesolution.com.br/painel/login/',
            crmUrl:'https://www.codesolution.com.br/painel/crm/'
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/crm-login-release-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record CRM login recovery status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce recovery
        if: always()
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          test "$VALIDATE" = success
          test "$SECRET" = success
          test "$DEPLOY" = success
          test "$SMOKE" = success
