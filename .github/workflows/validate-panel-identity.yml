name: Validate panel identity

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Workers"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-panel-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-panel-identity-production
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATTENDANT: https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate identity source and schema
        run: |
          set -euo pipefail
          node --check robo/panel-auth.js
          node --check robo/panel-auth-enhancements.js
          node --check robo/atendente-auth-growth-runtime.js
          python3 scripts/check-crm-schema.py

      - name: Require personal Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Verify identity tables and primary admin seed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('panel_users','panel_sessions','panel_audit_log') ORDER BY name; SELECT username,role,active,password_iterations FROM panel_users WHERE username='admin';" --json >/tmp/identity-db.json
          node - <<'NODE'
          const fs=require('fs');const t=fs.readFileSync('/tmp/identity-db.json','utf8');
          for(const x of ['panel_users','panel_sessions','panel_audit_log','admin']) if(!t.includes(x)) throw new Error(`missing ${x}`);
          if(!t.includes('100000')) throw new Error('Cloudflare-compatible admin password hardening not found');
          NODE

      - name: Real identity and session lifecycle smoke
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          suffix=$(node -e "process.stdout.write(crypto.randomUUID().replace(/-/g,'').slice(0,12))")
          user="ci_${suffix}"
          user_id="ci-${user}"
          pass="Ci!${suffix}Aa9#Governance"
          next_pass="Nx!${suffix}Bb8#Security"
          export USERNAME="$user" USER_ID="$user_id" PASSWORD="$pass"

          sql=$(node - <<'NODE'
          const {pbkdf2Sync,randomBytes}=require('crypto');
          const user=process.env.USERNAME,id=process.env.USER_ID,pass=process.env.PASSWORD,salt=randomBytes(24),iterations=100000;
          const hash=pbkdf2Sync(pass,salt,iterations,32,'sha256').toString('hex');
          const esc=s=>String(s).replace(/'/g,"''");
          process.stdout.write(`INSERT INTO panel_users (id,username,display_name,role,password_hash,password_salt,password_iterations,active,session_version,created_at,updated_at) VALUES ('${esc(id)}','${esc(user)}','CI Governance','leitura_executiva','${hash}','${salt.toString('hex')}',${iterations},1,1,datetime('now'),datetime('now'));`);
          NODE
          )

          seeded=false
          for attempt in 1 2 3 4 5; do
            if npx wrangler@4 d1 execute code-solution-crm --remote --command="$sql" --yes >/tmp/seed.log 2>&1; then seeded=true; break; fi
            sleep 3
          done
          test "$seeded" = true

          cleanup(){
            npx wrangler@4 d1 execute code-solution-crm --remote --command="DELETE FROM panel_sessions WHERE user_id='${user_id}'; DELETE FROM panel_audit_log WHERE user_id='${user_id}' OR username='${user}'; DELETE FROM panel_users WHERE id='${user_id}';" --yes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          expect_http(){
            label="$1" expected="$2" actual="$3"
            echo "$label HTTP=$actual expected=$expected"
            test "$actual" = "$expected"
          }

          anonymous=$(curl -sS -o /tmp/no-session.json -w '%{http_code}' "$ATTENDANT/auth/session")
          expect_http anonymous_session 401 "$anonymous"

          login1=$(curl -sS -o /tmp/login1.json -w '%{http_code}' "$ATTENDANT/auth/login" -H 'content-type: application/json' --data "{\"username\":\"${user}\",\"password\":\"${pass}\"}")
          expect_http login_1 200 "$login1"
          token1=$(node -e "const x=require('/tmp/login1.json');if(x.ok!==true||x.user?.role!=='leitura_executiva'||!x.token)process.exit(2);process.stdout.write(x.token)")

          session1=$(curl -sS -o /tmp/session1.json -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token1}")
          expect_http session_1 200 "$session1"
          USERNAME="$user" node -e "const x=require('/tmp/session1.json');if(x.ok!==true||x.user?.username!==process.env.USERNAME||!x.permissions?.includes('reports')||x.permissions?.includes('crm_write'))process.exit(2)"

          security1=$(curl -sS -o /tmp/security1.json -w '%{http_code}' "$ATTENDANT/auth/me/security" -H "authorization: Bearer ${token1}")
          expect_http security_1 200 "$security1"
          node -e "const x=require('/tmp/security1.json');if(x.ok!==true||typeof x.security?.activeSessions!=='number')process.exit(2)"

          login2=$(curl -sS -o /tmp/login2.json -w '%{http_code}' "$ATTENDANT/auth/login" -H 'content-type: application/json' --data "{\"username\":\"${user}\",\"password\":\"${pass}\"}")
          expect_http login_2 200 "$login2"
          token2=$(node -e "const x=require('/tmp/login2.json');if(x.ok!==true||!x.token)process.exit(2);process.stdout.write(x.token)")

          revoke=$(curl -sS -o /tmp/revoke.json -w '%{http_code}' -X POST "$ATTENDANT/auth/me/revoke-others" -H "authorization: Bearer ${token1}" -H 'content-type: application/json' --data '{}')
          expect_http revoke_others 200 "$revoke"
          node -e "const x=require('/tmp/revoke.json');if(x.ok!==true||x.currentSessionPreserved!==true||x.revoked<1)process.exit(2)"
          token1_after=$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token1}")
          expect_http preserved_current_session 200 "$token1_after"
          token2_after=$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token2}")
          expect_http revoked_other_session 401 "$token2_after"

          change=$(curl -sS -o /tmp/change.json -w '%{http_code}' -X POST "$ATTENDANT/auth/me/password" -H "authorization: Bearer ${token1}" -H 'content-type: application/json' --data "{\"currentPassword\":\"${pass}\",\"newPassword\":\"${next_pass}\"}")
          expect_http password_change 200 "$change"
          node -e "const x=require('/tmp/change.json');if(x.ok!==true||x.sessionsRevoked!==true)process.exit(2)"
          old_token=$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token1}")
          expect_http old_session_revoked_after_password 401 "$old_token"

          relogin=$(curl -sS -o /tmp/relogin.json -w '%{http_code}' "$ATTENDANT/auth/login" -H 'content-type: application/json' --data "{\"username\":\"${user}\",\"password\":\"${next_pass}\"}")
          expect_http relogin 200 "$relogin"
          next_token=$(node -e "const x=require('/tmp/relogin.json');if(x.ok!==true||!x.token)process.exit(2);process.stdout.write(x.token)")
          logout=$(curl -sS -o /tmp/logout.json -w '%{http_code}' -X POST "$ATTENDANT/auth/logout" -H "authorization: Bearer ${next_token}")
          expect_http logout 200 "$logout"
          logged_out=$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${next_token}")
          expect_http logged_out_session 401 "$logged_out"

      - name: Publish identity validation summary
        if: always()
        run: |
          {
            echo '## Code Solution · Panel identity'
            echo ''
            echo '- D1 identity tables and admin seed verified at 100,000 PBKDF2 iterations.'
            echo '- Ephemeral login, two-session revocation, security, password change, re-login and logout exercised.'
            echo '- Test identity is removed automatically.'
            echo '- Repository writes: disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
