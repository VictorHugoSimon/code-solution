name: Validate panel identity

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-panel-identity-production
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATTENDANT: https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate identity source and schema
        run: |
          set -euo pipefail
          node --check robo/panel-auth.js
          node --check robo/panel-auth-enhancements.js
          node --check robo/atendente-auth-growth-runtime.js
          python3 scripts/check-crm-schema.py

      - name: Require personal Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Verify identity tables and primary admin seed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('panel_users','panel_sessions','panel_audit_log') ORDER BY name; SELECT username,role,active,password_iterations FROM panel_users WHERE username='admin';" --json >/tmp/identity-db.json
          node - <<'NODE'
          const fs=require('fs');const t=fs.readFileSync('/tmp/identity-db.json','utf8');
          for(const x of ['panel_users','panel_sessions','panel_audit_log','admin']) if(!t.includes(x)) throw new Error(`missing ${x}`);
          if(!t.includes('180000')) throw new Error('admin password hardening not found');
          NODE

      - name: Real identity password and session smoke with ephemeral user
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          suffix=$(node -e "process.stdout.write(crypto.randomUUID().replace(/-/g,'').slice(0,12))")
          user="ci_${suffix}"
          user_id="ci-${user}"
          pass="Ci!${suffix}Aa9#Governance"
          next_pass="Nx!${suffix}Bb8#Security"
          export USERNAME="$user" USER_ID="$user_id" PASSWORD="$pass"

          sql=$(node - <<'NODE'
          const {pbkdf2Sync,randomBytes}=require('crypto');
          const user=process.env.USERNAME,id=process.env.USER_ID,pass=process.env.PASSWORD,salt=randomBytes(24),iterations=180000;
          const hash=pbkdf2Sync(pass,salt,iterations,32,'sha256').toString('hex');
          const esc=s=>String(s).replace(/'/g,"''");
          process.stdout.write(`INSERT INTO panel_users (id,username,display_name,role,password_hash,password_salt,password_iterations,active,session_version,created_at,updated_at) VALUES ('${esc(id)}','${esc(user)}','CI Governance','leitura_executiva','${hash}','${salt.toString('hex')}',${iterations},1,1,datetime('now'),datetime('now'));`);
          NODE
          )

          seeded=false
          for attempt in 1 2 3 4 5; do
            if npx wrangler@4 d1 execute code-solution-crm --remote --command="$sql" --yes; then seeded=true; break; fi
            sleep 4
          done
          test "$seeded" = true

          cleanup(){
            npx wrangler@4 d1 execute code-solution-crm --remote --command="DELETE FROM panel_sessions WHERE user_id='${user_id}'; DELETE FROM panel_audit_log WHERE user_id='${user_id}' OR username='${user}'; DELETE FROM panel_users WHERE id='${user_id}';" --yes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(curl -sS -o /tmp/no-session.json -w '%{http_code}' "$ATTENDANT/auth/session")" = 401
          login_http=$(curl -sS -o /tmp/login.json -w '%{http_code}' "$ATTENDANT/auth/login" -H 'content-type: application/json' --data "{\"username\":\"${user}\",\"password\":\"${pass}\"}")
          test "$login_http" = 200
          token=$(node -e "const x=require('/tmp/login.json');if(x.ok!==true||x.user?.role!=='leitura_executiva'||!x.token)process.exit(2);process.stdout.write(x.token)")

          session_http=$(curl -sS -o /tmp/session.json -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token}")
          test "$session_http" = 200
          USERNAME="$user" node -e "const x=require('/tmp/session.json');if(x.ok!==true||x.user?.username!==process.env.USERNAME||!x.permissions?.includes('reports')||x.permissions?.includes('crm_write'))process.exit(2)"

          security_http=$(curl -sS -o /tmp/security.json -w '%{http_code}' "$ATTENDANT/auth/me/security" -H "authorization: Bearer ${token}")
          test "$security_http" = 200
          node -e "const x=require('/tmp/security.json');if(x.ok!==true||typeof x.security?.activeSessions!=='number')process.exit(2)"

          change_http=$(curl -sS -o /tmp/change.json -w '%{http_code}' -X POST "$ATTENDANT/auth/me/password" -H "authorization: Bearer ${token}" -H 'content-type: application/json' --data "{\"currentPassword\":\"${pass}\",\"newPassword\":\"${next_pass}\"}")
          test "$change_http" = 200
          node -e "const x=require('/tmp/change.json');if(x.ok!==true||x.sessionsRevoked!==true)process.exit(2)"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${token}")" = 401

          relogin_http=$(curl -sS -o /tmp/relogin.json -w '%{http_code}' "$ATTENDANT/auth/login" -H 'content-type: application/json' --data "{\"username\":\"${user}\",\"password\":\"${next_pass}\"}")
          test "$relogin_http" = 200
          next_token=$(node -e "const x=require('/tmp/relogin.json');if(x.ok!==true||!x.token)process.exit(2);process.stdout.write(x.token)")
          logout_http=$(curl -sS -o /tmp/logout.json -w '%{http_code}' -X POST "$ATTENDANT/auth/logout" -H "authorization: Bearer ${next_token}")
          test "$logout_http" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session" -H "authorization: Bearer ${next_token}")" = 401

      - name: Publish identity validation summary
        if: always()
        run: |
          {
            echo '## Code Solution · Panel identity'
            echo ''
            echo '- D1 identity tables and admin seed verified.'
            echo '- Ephemeral login/session/security/password-change/logout flow exercised.'
            echo '- Test identity is removed automatically.'
            echo '- Repository writes: disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
