name: Repair Code Solution admin access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-admin-access.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-code-solution-admin-access
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare account
        id: account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Restore primary admin credentials in production D1
        id: restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="INSERT OR IGNORE INTO panel_users (id,username,display_name,role,password_hash,password_salt,password_iterations,active,session_version,created_at,updated_at) VALUES ('panel-admin-primary','admin','Administrador Code Solution','admin','e1c5a7fe4b10292d27cdee5b7f0edd35b1f2147989c1006f0dd2e78f7ed5e77e','b63155fca74dc4b59301f01d54f17e9d0cc75330b506e090',180000,1,1,datetime('now'),datetime('now')); UPDATE panel_users SET display_name='Administrador Code Solution',role='admin',password_hash='e1c5a7fe4b10292d27cdee5b7f0edd35b1f2147989c1006f0dd2e78f7ed5e77e',password_salt='b63155fca74dc4b59301f01d54f17e9d0cc75330b506e090',password_iterations=180000,active=1,session_version=session_version+1,updated_at=datetime('now') WHERE username='admin'; UPDATE panel_sessions SET revoked_at=datetime('now') WHERE user_id=(SELECT id FROM panel_users WHERE username='admin') AND revoked_at IS NULL;" --yes

      - name: Verify admin record
        id: verify
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,role,active,password_hash,password_salt,password_iterations,session_version FROM panel_users WHERE username='admin' LIMIT 1;" --json >/tmp/admin.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/admin.json','utf8');
          for(const expected of [
            'admin',
            'e1c5a7fe4b10292d27cdee5b7f0edd35b1f2147989c1006f0dd2e78f7ed5e77e',
            'b63155fca74dc4b59301f01d54f17e9d0cc75330b506e090',
            '180000'
          ]) if(!raw.includes(expected)) throw new Error(`admin verification failed: ${expected}`);
          if(!raw.includes('\"active\": 1') && !raw.includes('\"active\":1')) throw new Error('admin is not active');
          console.log('Primary admin record restored and verified.');
          NODE

      - name: Persist admin repair status
        if: always()
        env:
          ACCOUNT_OUTCOME: ${{ steps.account.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/admin-access-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),
            sourceCommit:e.SOURCE_SHA,
            cloudflareAccount:'cad25fe6c91871bbafb58236cf9b9b81',
            database:'code-solution-crm',
            username:'admin',
            accountValidation:e.ACCOUNT_OUTCOME||'skipped',
            credentialRotation:e.RESTORE_OUTCOME||'skipped',
            d1RecordVerification:e.VERIFY_OUTCOME||'skipped',
            passwordStoredInRepository:false
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution Admin Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/admin-access-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record admin access repair status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce repair
        if: always()
        env:
          ACCOUNT_OUTCOME: ${{ steps.account.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$ACCOUNT_OUTCOME" = success
          test "$RESTORE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
