name: Repair Code Solution admin access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-admin-access.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-code-solution-admin-access
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Restore primary admin credentials in production D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="INSERT OR IGNORE INTO panel_users (id,username,display_name,role,password_hash,password_salt,password_iterations,active,session_version,created_at,updated_at) VALUES ('panel-admin-primary','admin','Administrador Code Solution','admin','76daa7a58f25f564048058423e8fdab5c04a6c35be74be06ca95fa3ac125cbe3','fb137c0aa893e9ae9ac64296fb2e1bbc98ac9b482f379e70',180000,1,1,datetime('now'),datetime('now')); UPDATE panel_users SET display_name='Administrador Code Solution',role='admin',password_hash='76daa7a58f25f564048058423e8fdab5c04a6c35be74be06ca95fa3ac125cbe3',password_salt='fb137c0aa893e9ae9ac64296fb2e1bbc98ac9b482f379e70',password_iterations=180000,active=1,session_version=session_version+1,updated_at=datetime('now') WHERE username='admin'; UPDATE panel_sessions SET revoked_at=datetime('now') WHERE user_id=(SELECT id FROM panel_users WHERE username='admin') AND revoked_at IS NULL;" --yes

      - name: Verify admin record
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT username,role,active,password_hash,password_salt,password_iterations,session_version FROM panel_users WHERE username='admin' LIMIT 1;" --json >/tmp/admin.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/admin.json','utf8');
          for(const expected of [
            'admin',
            '76daa7a58f25f564048058423e8fdab5c04a6c35be74be06ca95fa3ac125cbe3',
            'fb137c0aa893e9ae9ac64296fb2e1bbc98ac9b482f379e70',
            '180000'
          ]) if(!raw.includes(expected)) throw new Error(`admin verification failed: ${expected}`);
          if(!raw.includes('\"active\": 1') && !raw.includes('\"active\":1')) throw new Error('admin is not active');
          console.log('Primary admin record restored and verified.');
          NODE
