name: Content integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/**'
      - 'robo/**'
      - 'package.json'
      - '.github/workflows/content-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate worker syntax
        id: worker_check
        continue-on-error: true
        run: npm run check:workers

      - name: Rebuild blog index
        id: blog_index
        continue-on-error: true
        run: npm run blog:index

      - name: Commit regenerated blog index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.blog_index.outcome == 'success'
        run: |
          if git diff --quiet -- content/blog/index.json; then
            echo "Index already current"
            exit 0
          fi
          git config user.name "Code Solution Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog/index.json
          git commit -m "chore: rebuild blog index"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Persist validation status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_OUTCOME: ${{ steps.worker_check.outcome }}
          BLOG_OUTCOME: ${{ steps.blog_index.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          cat > docs/content-integrity-status.json <<EOF
          {
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceCommit": "$SOURCE_SHA",
            "workerSyntax": "$WORKER_OUTCOME",
            "blogIndexBuild": "$BLOG_OUTCOME"
          }
          EOF
          git config user.name "Code Solution CI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/content-integrity-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record content integrity status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce validation
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker_check.outcome }}
          BLOG_OUTCOME: ${{ steps.blog_index.outcome }}
        run: |
          test "$WORKER_OUTCOME" = "success"
          test "$BLOG_OUTCOME" = "success"
