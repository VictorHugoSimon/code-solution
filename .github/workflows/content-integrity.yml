name: Content integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/**'
      - 'robo/**'
      - 'crm/migrations/**'
      - 'package.json'
      - '.github/workflows/content-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate worker syntax
        id: worker_check
        continue-on-error: true
        run: npm run check:workers

      - name: Validate CRM D1 schema
        id: crm_schema
        continue-on-error: true
        run: python3 scripts/check-crm-schema.py

      - name: Rebuild blog index
        id: blog_index
        continue-on-error: true
        run: npm run blog:index

      - name: Build static multilingual blog
        id: static_blog
        continue-on-error: true
        if: steps.blog_index.outcome == 'success'
        run: npm run blog:static

      - name: Prepare Pages SEO/AEO and security
        id: pages_prepare
        continue-on-error: true
        if: steps.static_blog.outcome == 'success'
        run: npm run pages:prepare

      - name: Commit generated web artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.blog_index.outcome == 'success' && steps.static_blog.outcome == 'success' && steps.pages_prepare.outcome == 'success'
        run: |
          git config user.name "Code Solution Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog/index.json deploy/blog deploy/en/blog deploy/es/blog deploy/sitemap.xml deploy/index.html deploy/servicos/index.html deploy/painel deploy/_headers
          if git diff --cached --quiet; then
            echo "Generated web artifacts are current"
            exit 0
          fi
          git commit -m "chore: rebuild crawlable Pages bundle"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Persist validation status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_OUTCOME: ${{ steps.worker_check.outcome }}
          SCHEMA_OUTCOME: ${{ steps.crm_schema.outcome }}
          BLOG_OUTCOME: ${{ steps.blog_index.outcome }}
          STATIC_OUTCOME: ${{ steps.static_blog.outcome }}
          PAGES_OUTCOME: ${{ steps.pages_prepare.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          cat > docs/content-integrity-status.json <<EOF
          {
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceCommit": "$SOURCE_SHA",
            "workerSyntax": "$WORKER_OUTCOME",
            "crmSchema": "$SCHEMA_OUTCOME",
            "blogIndexBuild": "$BLOG_OUTCOME",
            "staticBlogBuild": "$STATIC_OUTCOME",
            "pagesPreparation": "$PAGES_OUTCOME"
          }
          EOF
          git config user.name "Code Solution CI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/content-integrity-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record content integrity status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce validation
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker_check.outcome }}
          SCHEMA_OUTCOME: ${{ steps.crm_schema.outcome }}
          BLOG_OUTCOME: ${{ steps.blog_index.outcome }}
          STATIC_OUTCOME: ${{ steps.static_blog.outcome }}
          PAGES_OUTCOME: ${{ steps.pages_prepare.outcome }}
        run: |
          test "$WORKER_OUTCOME" = "success"
          test "$SCHEMA_OUTCOME" = "success"
          test "$BLOG_OUTCOME" = "success"
          test "$STATIC_OUTCOME" = "success"
          test "$PAGES_OUTCOME" = "success"
