name: Content integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/**'
      - 'robo/**'
      - 'crm/migrations/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/content-integrity.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate workers
        run: npm run check:workers

      - name: Validate CRM D1 schema
        run: python3 scripts/check-crm-schema.py

      - name: Rebuild blog index
        run: npm run blog:index

      - name: Build static multilingual blog
        run: npm run blog:static

      - name: Prepare Pages SEO AEO security and branding
        run: npm run pages:prepare

      - name: Validate all production surfaces
        run: |
          set -euo pipefail
          for file in \
            deploy/index.html \
            deploy/servicos/index.html \
            deploy/setores/index.html \
            deploy/calculadora/index.html \
            deploy/diagnostico/index.html \
            deploy/assistente/index.html \
            deploy/privacidade/index.html \
            deploy/painel/index.html \
            deploy/painel/crm/index.html \
            deploy/painel/marketing/index.html \
            deploy/painel/inteligencia/index.html \
            deploy/painel/growth/index.html \
            deploy/painel/usuarios/index.html \
            deploy/painel/conta/index.html \
            deploy/_worker.js; do
            test -f "$file"
          done

          node --check deploy/_worker.js
          npm run check:bundled-surfaces
          npm run check:panel-nav

          # Stable functional markers only. Copy-level checks belong to the
          # dedicated structural validators above and should not make CI fail
          # when product wording changes.
          grep -q 'cs-home-lead-form' deploy/index.html
          grep -q '/auth/login' deploy/_worker.js
          grep -q 'cs_panel_session' deploy/_worker.js
          grep -q 'filterPanelNavigation' deploy/_worker.js
          grep -q 'name="username"' deploy/_worker.js
          grep -q 'name="password"' deploy/_worker.js
          grep -qi 'Code Solution' deploy/assistente/index.html
          if grep -qi '\bCodi\b' deploy/assistente/index.html; then
            echo '::error::Legacy assistant branding found in public assistant'
            exit 1
          fi

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo '## Code Solution · Content integrity'
            echo ''
            echo '- Source: `${{ github.sha }}`'
            echo '- Release owner: `deploy-pages.yml`'
            echo '- This workflow is read-only and never commits generated files.'
            echo '- Workers, CRM schema, structured Pages bundle, role-aware panel navigation and public branding validated.'
          } >> "$GITHUB_STEP_SUMMARY"
