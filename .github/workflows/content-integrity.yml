name: Content integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/**'
      - 'robo/**'
      - 'crm/migrations/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/content-integrity.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate workers
        id: worker_check
        continue-on-error: true
        run: npm run check:workers

      - name: Validate CRM D1 schema
        id: crm_schema
        continue-on-error: true
        run: python3 scripts/check-crm-schema.py

      - name: Rebuild blog index
        id: blog_index
        continue-on-error: true
        run: npm run blog:index

      - name: Build static multilingual blog
        id: static_blog
        continue-on-error: true
        if: steps.blog_index.outcome == 'success'
        run: npm run blog:static

      - name: Prepare Pages SEO AEO security and branding
        id: pages_prepare
        continue-on-error: true
        if: steps.static_blog.outcome == 'success'
        run: npm run pages:prepare

      - name: Validate all production surfaces
        id: surfaces
        continue-on-error: true
        if: steps.pages_prepare.outcome == 'success'
        run: |
          set -euo pipefail
          test -f deploy/index.html
          test -f deploy/servicos/index.html
          test -f deploy/setores/index.html
          test -f deploy/calculadora/index.html
          test -f deploy/diagnostico/index.html
          test -f deploy/assistente/index.html
          test -f deploy/privacidade/index.html
          test -f deploy/painel/index.html
          test -f deploy/painel/crm/index.html
          test -f deploy/painel/marketing/index.html
          test -f deploy/painel/inteligencia/index.html
          test -f deploy/painel/growth/index.html
          test -f deploy/_worker.js
          node --check deploy/_worker.js
          npm run check:bundled-surfaces
          grep -q 'COMMERCIAL-EXTENSION:START' deploy/index.html
          grep -q 'cs-home-lead-form' deploy/index.html
          grep -qi 'Sistemas sob medida para o agronegócio' deploy/setores/index.html
          grep -qi 'Quanto custa construir seu sistema' deploy/calculadora/index.html
          grep -qi 'Diagnóstico Digital' deploy/diagnostico/index.html
          grep -qi 'Code Solution' deploy/assistente/index.html
          grep -qi 'Acesso ao CRM' deploy/_worker.js
          grep -qi 'cs_panel_session' deploy/_worker.js
          grep -qi 'Visão executiva' deploy/painel/index.html
          grep -qi 'Marketing & Aquisição' deploy/painel/marketing/index.html
          grep -qi 'Inteligência Comercial' deploy/painel/inteligencia/index.html
          grep -qi 'Organic Growth Engine' deploy/painel/growth/index.html
          grep -qi 'Empresas detectadas pelo Radar' deploy/painel/growth/index.html
          grep -qi 'Novo lead' deploy/painel/crm/index.html
          grep -qi 'Todas origens' deploy/painel/crm/index.html
          if grep -qi '\bCodi\b' deploy/assistente/index.html; then echo '::error::Legacy assistant branding found in public assistant'; exit 1; fi
          grep -qi 'Privacidade' deploy/privacidade/index.html

      - name: Commit generated artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.surfaces.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "Code Solution Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog/index.json deploy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: rebuild Code Solution production bundle"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Persist validation status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_OUTCOME: ${{ steps.worker_check.outcome }}
          SCHEMA_OUTCOME: ${{ steps.crm_schema.outcome }}
          BLOG_OUTCOME: ${{ steps.blog_index.outcome }}
          STATIC_OUTCOME: ${{ steps.static_blog.outcome }}
          PAGES_OUTCOME: ${{ steps.pages_prepare.outcome }}
          SURFACES_OUTCOME: ${{ steps.surfaces.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/content-integrity-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,
            workerSyntax:e.WORKER_OUTCOME,crmSchema:e.SCHEMA_OUTCOME,
            blogIndexBuild:e.BLOG_OUTCOME,staticBlogBuild:e.STATIC_OUTCOME,
            pagesPreparation:e.PAGES_OUTCOME,productionSurfaces:e.SURFACES_OUTCOME,
            growthPanelSurface:'enforced',operationalPanelSurfaces:'enforced',releaseOwner:'deploy-pages.yml'
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution CI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/content-integrity-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record content integrity status"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Enforce validation
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker_check.outcome }}
          SCHEMA_OUTCOME: ${{ steps.crm_schema.outcome }}
          BLOG_OUTCOME: ${{ steps.blog_index.outcome }}
          STATIC_OUTCOME: ${{ steps.static_blog.outcome }}
          PAGES_OUTCOME: ${{ steps.pages_prepare.outcome }}
          SURFACES_OUTCOME: ${{ steps.surfaces.outcome }}
        run: |
          test "$WORKER_OUTCOME" = success
          test "$SCHEMA_OUTCOME" = success
          test "$BLOG_OUTCOME" = success
          test "$STATIC_OUTCOME" = success
          test "$PAGES_OUTCOME" = success
          test "$SURFACES_OUTCOME" = success

  ops_deploy_pages:
    needs: validate
    if: "${{ github.event_name == 'pull_request' && github.actor == 'VictorHugoSimon' && github.event.pull_request.title == 'OPS: Deploy Code Solution Pages' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production from main
        id: build
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          npm run check:bundled-surfaces
          node --check deploy/_worker.js
          grep -q "LOGIN_USERNAME = 'admin'" deploy/_worker.js
          grep -q 'LOGIN_PASSWORD_SHA256' deploy/_worker.js
          grep -qi 'Code Solution' deploy/assistente/index.html
          if grep -qi '\bCodi\b' deploy/assistente/index.html; then exit 1; fi

      - name: Verify production credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'cad25fe6c91871bbafb58236cf9b9b81'

      - name: Sync CRM secret to Pages
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name=codesolution-site

      - name: Deploy Pages production
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          npx wrangler@4 pages deploy deploy --project-name=codesolution-site --commit-hash="$MAIN_SHA" --commit-message="Code Solution CRM login production"

      - name: Validate live CRM and public production
        id: smoke
        env:
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          sleep 15
          login_http=$(curl -sS --retry 6 --retry-delay 3 -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$login_http" = 200
          grep -q 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html
          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null https://www.codesolution.com.br/painel/crm/
          test "$(head -n1 "$headers" | awk '{print $2}')" = 302
          grep -i '^location:' "$headers" | grep -q '/painel/login/'
          api_http=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)
          test "$api_http" = 401
          backend_http=$(curl -sS -o /tmp/backend.json -w '%{http_code}' -H "x-crm-key: ${CRM_ADMIN_KEY}" https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/crm/summary)
          test "$backend_http" = 200
          node -e "const x=require('/tmp/backend.json'); if(x.ok!==true) process.exit(1)"
          curl -LfsS https://www.codesolution.com.br/assistente/ >/tmp/assistant.html
          grep -qi 'Code Solution' /tmp/assistant.html
          if grep -qi '\bCodi\b' /tmp/assistant.html; then exit 1; fi
          apex_headers=$(mktemp)
          curl -sS -D "$apex_headers" -o /dev/null https://codesolution.com.br/
          test "$(head -n1 "$apex_headers" | awk '{print $2}')" = 301
          grep -i '^location:' "$apex_headers" | grep -q '^location: https://www.codesolution.com.br/'
