name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'robo/**'
      - 'crm/migrations/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers-production
  cancel-in-progress: true

env:
  EXPECTED_CLOUDFLARE_ACCOUNT_ID: cad25fe6c91871bbafb58236cf9b9b81

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require personal Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_CLOUDFLARE_ACCOUNT_ID"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Validate Worker source and Proposal Agent policy
        run: |
          set -euo pipefail
          node --check robo/worker.js
          node --check robo/panel-auth.js
          node --check robo/panel-auth-enhancements.js
          node --check robo/atendente-worker.js
          node --check robo/atendente-worker-runtime.js
          node --check robo/atendente-growth-runtime.js
          node --check robo/atendente-auth-growth-runtime.js
          node --check robo/growth-api.js
          node --check robo/crm-automation.js
          node --check robo/proposal-agent.js
          node --check robo/autonomous-os.js
          node --check robo/autonomy-entry-runtime.js
          node scripts/check-proposal-agent.mjs
          python3 scripts/check-crm-schema.py

      - name: Provision CRM D1 and apply all migrations
        id: d1
        working-directory: robo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 list --json > /tmp/d1-list.json
          DB_ID=$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const a=Array.isArray(x)?x:(x.result||x.databases||[]);
          const d=a.find(v=>v.name==='code-solution-crm');
          process.stdout.write(d?.uuid||d?.id||'');
          NODE
          )
          if [ -z "$DB_ID" ]; then
            npx wrangler@4 d1 create code-solution-crm
            npx wrangler@4 d1 list --json > /tmp/d1-list.json
            DB_ID=$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const a=Array.isArray(x)?x:(x.result||x.databases||[]);
          const d=a.find(v=>v.name==='code-solution-crm');
          if(!d) process.exit(2);
          process.stdout.write(d.uuid||d.id||'');
          NODE
            )
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

          for migration in ../crm/migrations/*.sql; do
            echo "Applying $migration"
            npx wrangler@4 d1 execute code-solution-crm --remote --file="$migration" --yes
          done

          npx wrangler@4 d1 execute code-solution-crm --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('leads','crm_tasks','crm_alerts','crm_owners','crm_automation_runs','lead_acquisition_links','acquisition_events','growth_accounts','panel_users','panel_sessions','panel_audit_log','autonomy_goals','autonomy_runs','autonomy_tasks','autonomy_decisions','autonomy_approvals','crm_proposals','crm_proposal_events') ORDER BY name;" --json > /tmp/schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/schema-check.json','utf8');
          for(const name of ['leads','crm_tasks','crm_alerts','crm_owners','crm_automation_runs','lead_acquisition_links','acquisition_events','growth_accounts','panel_users','panel_sessions','panel_audit_log','autonomy_goals','autonomy_runs','autonomy_tasks','autonomy_decisions','autonomy_approvals','crm_proposals','crm_proposal_events']) {
            if(!text.includes(name)) throw new Error(`missing table ${name}`);
          }
          NODE

          cp wrangler-atendente.toml wrangler-atendente.deploy.toml
          cat >> wrangler-atendente.deploy.toml <<EOF

          [[d1_databases]]
          binding = "CRM_DB"
          database_name = "code-solution-crm"
          database_id = "$DB_ID"
          EOF

      - name: Deploy content Worker
        id: content
        working-directory: robo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler.toml

      - name: Sync content Worker secrets
        working-directory: robo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.GITHUB_CONTENT_TOKEN }}
          MANUAL_KEY: ${{ secrets.MANUAL_KEY }}
        run: |
          set -euo pipefail
          [ -z "$AI_API_KEY" ] || printf '%s' "$AI_API_KEY" | npx wrangler@4 secret put AI_API_KEY --config wrangler.toml
          [ -z "$GITHUB_CONTENT_TOKEN" ] || printf '%s' "$GITHUB_CONTENT_TOKEN" | npx wrangler@4 secret put GITHUB_TOKEN --config wrangler.toml
          [ -z "$MANUAL_KEY" ] || printf '%s' "$MANUAL_KEY" | npx wrangler@4 secret put MANUAL_KEY --config wrangler.toml

      - name: Deploy attendant Worker with D1 and autonomous cron
        id: attendant
        working-directory: robo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler-atendente.deploy.toml

      - name: Sync attendant Worker secrets
        working-directory: robo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          OWNER_WHATSAPP: ${{ secrets.OWNER_WHATSAPP }}
        run: |
          set -euo pipefail
          cfg=wrangler-atendente.deploy.toml
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 secret put CRM_ADMIN_KEY --config "$cfg"
          [ -z "$AI_API_KEY" ] || printf '%s' "$AI_API_KEY" | npx wrangler@4 secret put AI_API_KEY --config "$cfg"
          [ -z "$WHATSAPP_TOKEN" ] || printf '%s' "$WHATSAPP_TOKEN" | npx wrangler@4 secret put WHATSAPP_TOKEN --config "$cfg"
          [ -z "$WHATSAPP_PHONE_ID" ] || printf '%s' "$WHATSAPP_PHONE_ID" | npx wrangler@4 secret put WHATSAPP_PHONE_ID --config "$cfg"
          [ -z "$OWNER_WHATSAPP" ] || printf '%s' "$OWNER_WHATSAPP" | npx wrangler@4 secret put OWNER_WHATSAPP --config "$cfg"

      - name: Real production smoke for Workers CRM Autonomous OS Proposal Agent and panel security
        id: smoke
        env:
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          sleep 10
          CONTENT=https://code-solution-robo.victorhugoteixeirasimon6.workers.dev
          ATTENDANT=https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev

          curl -fsS --retry 5 --retry-delay 3 "$CONTENT/health" >/tmp/content.json
          curl -fsS --retry 5 --retry-delay 3 "$ATTENDANT/health" >/tmp/attendant.json
          curl -fsS --retry 5 --retry-delay 3 "$ATTENDANT/autonomy/health" >/tmp/autonomy-health.json
          node - <<'NODE'
          const c=require('/tmp/content.json'),a=require('/tmp/attendant.json'),h=require('/tmp/autonomy-health.json');
          if(c.ok!==true || c.ready!==true || !c.build) throw new Error('content worker not ready');
          if(a.ok!==true || a.service!=='code-solution-atendente' || a.storage!=='d1') throw new Error('attendant worker not on D1');
          if(h.ok!==true || !Array.isArray(h.agents) || !h.agents.includes('proposal')) throw new Error('Proposal Agent is not active in autonomy health');
          if(!Array.isArray(h.approvalGates) || !h.approvalGates.includes('proposal_send')) throw new Error('proposal_send approval gate missing');
          NODE

          chat_http=$(curl -sS --max-time 45 -o /tmp/chat.json -w '%{http_code}' "$ATTENDANT/chat" -H 'content-type: application/json' -H 'origin: https://www.codesolution.com.br' --data '{"messages":[{"role":"user","content":"Olá. Preciso automatizar um processo empresarial e quero entender o próximo passo."}],"context":{"source":"deploy_smoke","consent":true}}')
          test "$chat_http" = 200
          node - <<'NODE'
          const x=require('/tmp/chat.json');
          if(x.ok!==true || typeof x.message!=='string' || x.message.length<10) throw new Error('chat invalid');
          if(/\bCodi\b/i.test(x.message)) throw new Error('legacy assistant branding returned');
          NODE

          lead_http=$(curl -sS --max-time 20 -o /tmp/lead.json -w '%{http_code}' "$ATTENDANT/lead" -H 'content-type: application/json' -H 'origin: https://www.codesolution.com.br' --data '{"name":"","whatsapp":"","need":""}')
          test "$lead_http" = 400
          node - <<'NODE'
          const x=require('/tmp/lead.json');
          if(x.ok!==false || x.error!=='validation_error') throw new Error('lead validation contract invalid');
          NODE

          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/crm/summary")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/crm/autonomy/summary")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/crm/autonomy/proposals")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/session")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$ATTENDANT/auth/me/security")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$ATTENDANT/auth/me/password" -H 'content-type: application/json' --data '{}')" = 401

          for route in summary operations/summary acquisition/summary?days=30 alerts tasks owners growth/summary autonomy/summary autonomy/tasks autonomy/approvals autonomy/proposals?limit=5; do
            file=$(echo "$route" | tr '/?' '__')
            http=$(curl -sS --max-time 30 -o "/tmp/${file}.json" -w '%{http_code}' "$ATTENDANT/crm/$route" -H "x-crm-key: $CRM_ADMIN_KEY")
            test "$http" = 200
            FILE="/tmp/${file}.json" node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          if(x.ok!==true) throw new Error(`authenticated CRM smoke failed for ${process.env.FILE}`);
          NODE
          done

          node - <<'NODE'
          const x=require('/tmp/autonomy_proposals_limit=5.json');
          if(!Array.isArray(x.proposals)) throw new Error('proposal list contract invalid');
          NODE

          auto_http=$(curl -sS --max-time 40 -o /tmp/automation.json -w '%{http_code}' "$ATTENDANT/crm/automation/run" -X POST -H "x-crm-key: $CRM_ADMIN_KEY" -H 'content-type: application/json' --data '{}')
          test "$auto_http" = 200
          node - <<'NODE'
          const x=require('/tmp/automation.json');
          if(x.ok!==true || typeof x.leadsScanned!=='number') throw new Error('commercial automation run invalid');
          NODE

          autonomy_http=$(curl -sS --max-time 45 -o /tmp/autonomy-run.json -w '%{http_code}' "$ATTENDANT/crm/autonomy/run" -X POST -H "x-crm-key: $CRM_ADMIN_KEY" -H 'content-type: application/json' --data '{}')
          test "$autonomy_http" = 200
          curl -fsS --max-time 30 "$ATTENDANT/crm/autonomy/summary" -H "x-crm-key: $CRM_ADMIN_KEY" >/tmp/autonomy-summary.json
          node - <<'NODE'
          const run=require('/tmp/autonomy-run.json');
          const x=require('/tmp/autonomy-summary.json');
          if(run.ok!==true || typeof run.tasksCreated!=='number' || typeof run.tasksExecuted!=='number' || typeof run.approvalsRequested!=='number') throw new Error('autonomous run invalid');
          if(x.ok!==true || !Array.isArray(x.agents) || !Array.isArray(x.goals) || !Array.isArray(x.pendingApprovals)) throw new Error('autonomy summary invalid');
          for(const id of ['orchestrator','sales_ops','prospecting','content','reliability','proposal']) if(!x.agents.some(a=>a.id===id)) throw new Error(`missing autonomy agent ${id}`);
          if(x.policy?.failMode!=='fail_closed') throw new Error('autonomy policy must fail closed');
          if(!x.policy?.autoExecute?.includes('proposal_draft_generation')) throw new Error('proposal draft internal policy missing');
          if(!x.policy?.approvalRequired?.includes('external_message') || !x.policy?.approvalRequired?.includes('proposal_send') || !x.policy?.approvalRequired?.includes('destructive_change')) throw new Error('critical approval gates missing');
          if(typeof x.proposalCounts!=='object' || x.proposalCounts===null) throw new Error('proposalCounts missing');
          NODE

      - name: Publish release summary
        if: always()
        run: |
          {
            echo '## Code Solution · Workers + Autonomous OS + Proposal Agent production release'
            echo ''
            echo '- Source: `${{ github.sha }}`'
            echo '- Cloudflare account: personal account enforced'
            echo '- D1 migrations: `${{ steps.d1.outcome }}`'
            echo '- Content Worker: `${{ steps.content.outcome }}`'
            echo '- Attendant + Autonomous OS Worker: `${{ steps.attendant.outcome }}`'
            echo '- Proposal Agent: draft generation active; proposal_send human-gated'
            echo '- Production smoke: `${{ steps.smoke.outcome }}`'
            echo '- External critical actions: approval gated'
            echo '- Repository writes: disabled'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce production release
        if: always()
        env:
          CONFIGURED: ${{ steps.cf.outputs.configured }}
          D1_OUTCOME: ${{ steps.d1.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          ATTENDANT_OUTCOME: ${{ steps.attendant.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$CONFIGURED" = true
          test "$D1_OUTCOME" = success
          test "$CONTENT_OUTCOME" = success
          test "$ATTENDANT_OUTCOME" = success
          test "$SMOKE_OUTCOME" = success
