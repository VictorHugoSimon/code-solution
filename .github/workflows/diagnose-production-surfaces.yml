name: Diagnose production surface build gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build generated production surfaces
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare

      - name: Run granular surface diagnostics
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const e=process.env;
          const result={checkedAt:new Date().toISOString(),sourceCommit:e.SOURCE_SHA,build:e.BUILD_OUTCOME,checks:{},failures:[]};
          const record=(name,ok,detail='')=>{result.checks[name]={ok:Boolean(ok),detail};if(!ok)result.failures.push(name+(detail?`: ${detail}`:''));};
          const exists=(p)=>fs.existsSync(p);
          const contains=(p,s)=>{try{return fs.readFileSync(p,'utf8').toLowerCase().includes(String(s).toLowerCase())}catch{return false}};
          const files=[
            'deploy/index.html','deploy/servicos/index.html','deploy/setores/index.html','deploy/calculadora/index.html','deploy/diagnostico/index.html','deploy/assistente/index.html','deploy/privacidade/index.html','deploy/painel/index.html','deploy/painel/crm/index.html','deploy/painel/marketing/index.html','deploy/painel/inteligencia/index.html','deploy/painel/growth/index.html','deploy/_worker.js'
          ];
          for(const p of files) record(`file:${p}`,exists(p));
          try{cp.execFileSync('node',['--check','deploy/_worker.js'],{stdio:'pipe'});record('workerSyntax',true)}catch(err){record('workerSyntax',false,String(err.stderr||err.message).slice(0,800))}
          try{cp.execFileSync('npm',['run','check:bundled-surfaces'],{stdio:'pipe'});record('bundledSurfaces',true)}catch(err){record('bundledSurfaces',false,String(err.stderr||err.stdout||err.message).slice(0,1800))}
          const phrases=[
            ['homeCommercial','deploy/index.html','COMMERCIAL-EXTENSION:START'],['homeLead','deploy/index.html','cs-home-lead-form'],['sectorsAgro','deploy/setores/index.html','Sistemas sob medida para o agronegócio'],['calculatorTitle','deploy/calculadora/index.html','Quanto custa construir seu sistema'],['diagnosticTitle','deploy/diagnostico/index.html','Diagnóstico Digital'],['assistantBrand','deploy/assistente/index.html','Code Solution'],['loginCopy','deploy/_worker.js','Acesso ao CRM'],['sessionCookie','deploy/_worker.js','cs_panel_session'],['panelExecutive','deploy/painel/index.html','Visão executiva'],['marketingAcquisition','deploy/painel/marketing/index.html','Marketing & Aquisição'],['commercialIntelligence','deploy/painel/inteligencia/index.html','Inteligência Comercial'],['growthEngine','deploy/painel/growth/index.html','Organic Growth Engine'],['growthRadar','deploy/painel/growth/index.html','Empresas detectadas pelo Radar'],['crmNewLead','deploy/painel/crm/index.html','Novo lead'],['crmOrigins','deploy/painel/crm/index.html','Todas origens'],['privacy','deploy/privacidade/index.html','Privacidade']
          ];
          for(const [name,p,s] of phrases) record(name,contains(p,s));
          const assistant=exists('deploy/assistente/index.html')?fs.readFileSync('deploy/assistente/index.html','utf8'):'';
          record('noLegacyCodi',!(/\bCodi\b/i.test(assistant)));
          fs.mkdirSync('docs',{recursive:true});
          fs.writeFileSync('/tmp/surface-diagnostics.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Persist diagnostic only
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/surface-diagnostics.json docs/surface-diagnostics.json
          git config user.name 'Code Solution CI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/surface-diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record production surface diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
