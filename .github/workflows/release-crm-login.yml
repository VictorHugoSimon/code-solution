name: Release CRM login to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-crm-login.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-crm-login-production
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_ACCOUNT: cad25fe6c91871bbafb58236cf9b9b81
      PROJECT: codesolution-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate personal Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CRM_ADMIN_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"

      - name: Build current production bundle
        id: build
        run: |
          set -euo pipefail
          npm run blog:index
          npm run blog:static
          npm run pages:prepare
          npm run check:panel-nav
          npm run check:bundled-surfaces
          node --check deploy/_worker.js
          grep -q '/auth/login' deploy/_worker.js
          grep -q 'name="username"' deploy/_worker.js
          grep -q 'name="password"' deploy/_worker.js

      - name: Sync CRM technical secret to Pages
        id: secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_ADMIN_KEY: ${{ secrets.CRM_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CRM_ADMIN_KEY" | npx wrangler@4 pages secret put CRM_ADMIN_KEY --project-name="$PROJECT"

      - name: Deploy current main to production Pages
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy deploy --project-name="$PROJECT" --commit-hash="$GITHUB_SHA" --commit-message="CRM login production release $GITHUB_SHA"

      - name: Validate live CRM login surface
        id: smoke
        run: |
          set -euo pipefail
          sleep 12
          login_http=$(curl -sS --retry 6 --retry-delay 3 -o /tmp/login.html -w '%{http_code}' https://www.codesolution.com.br/painel/login/)
          test "$login_http" = 200
          grep -q 'Acesso ao CRM' /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          grep -q 'name="password"' /tmp/login.html

          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null https://www.codesolution.com.br/painel/crm/
          panel_http=$(head -n1 "$headers" | awk '{print $2}')
          panel_location=$(grep -i '^location:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2-)
          test "$panel_http" = 302
          echo "$panel_location" | grep -q '/painel/login/'

          api_http=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://www.codesolution.com.br/api/crm/summary)
          test "$api_http" = 401
          auth_http=$(curl -sS -o /tmp/auth.json -w '%{http_code}' https://code-solution-atendente.victorhugoteixeirasimon6.workers.dev/auth/session)
          test "$auth_http" = 401

      - name: Persist CRM login release status
        if: always()
        env:
          CREDENTIALS: ${{ steps.credentials.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs'),e=process.env;
          fs.writeFileSync('docs/crm-login-release-status.json',JSON.stringify({
            checkedAt:new Date().toISOString(),
            sourceCommit:e.SOURCE_SHA,
            cloudflareAccount:'cad25fe6c91871bbafb58236cf9b9b81',
            project:'codesolution-site',
            loginUrl:'https://www.codesolution.com.br/painel/login/',
            crmUrl:'https://www.codesolution.com.br/painel/crm/',
            username:'admin',
            credentials:e.CREDENTIALS||'skipped',
            build:e.BUILD||'skipped',
            pagesSecretSync:e.SECRET||'skipped',
            pagesDeploy:e.DEPLOY||'skipped',
            liveLoginSmoke:e.SMOKE||'skipped',
            plaintextPasswordStoredInRepository:false
          },null,2)+'\n');
          NODE
          git config user.name "Code Solution CRM Login Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/crm-login-release-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record CRM login production release"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce CRM login release
        if: always()
        env:
          CREDENTIALS: ${{ steps.credentials.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SECRET: ${{ steps.secret.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          test "$CREDENTIALS" = success
          test "$BUILD" = success
          test "$SECRET" = success
          test "$DEPLOY" = success
          test "$SMOKE" = success
